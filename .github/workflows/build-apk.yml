          using OpenYandere.Managers;
          using OpenYandere.Managers.Traits;
          using UnityEngine;

          namespace OpenYandere.Characters.Player
          {
              public class PlayerCamera : MonoBehaviour
              {
                  private PlayerMovement _playerMovement;

                  private Vector3 _targetHeightOffset;

                  private Vector3 _currentRotation;

                  private Vector3 _currentRotationVelocity;

                  private float _zoomDistance;

                  [Header("Target Settings:")]
                  private Transform _targetTransform;

                  [SerializeField]
                  private float _targetHeight = 1.65f;

                  [SerializeField]
                  private float _distanceFromTarget = 2f;

                  [Header("Vertical (Up and Down) Settings:")]
                  [SerializeField]
                  private float _verticalMinLimit = -40f;

                  [SerializeField]
                  private float _verticalMaxLimit = 80f;

                  [Header("Rotation Settings:")]
                  [SerializeField]
                  private float _rotationSmoothTime = 0.1f;

                  [Header("Mouse Settings:")]
                  [SerializeField]
                  private float _mouseSensitivity = 5f;

                  [SerializeField]
                  private float _zoomSpeed = 150f;

                  [SerializeField]
                  private float _zoomMinimumDistance = 1f;

                  [SerializeField]
                  private float _zoomMaximumDistance = 10f;

                  public float HorizontalAxis { get; set; }

                  public float VerticalAxis { get; set; }

                  private void Awake()
                  {
                      PlayerManager playerManager = Singleton<GameManager>.Instance.PlayerManager;
                      _playerMovement = playerManager.PlayerMovement;
                      _targetTransform = playerManager.Player.transform;
                      _targetHeightOffset = new Vector3(0f, _targetHeight, 0f);
                      HorizontalAxis = _targetTransform.eulerAngles.y;
                      VerticalAxis = _targetTransform.eulerAngles.x;
                      _zoomDistance = _distanceFromTarget;
                  }

                  private void LateUpdate()
                  {
                      if (Application.platform == RuntimePlatform.Android)
                      {
                          // Celular: so o dedo de olhar mexe a camera (o joystick nunca mexe).
                          // Botao + aproxima e botao - afasta.
                          HorizontalAxis += TouchControls.Look.x * _mouseSensitivity;
                          VerticalAxis -= TouchControls.Look.y * _mouseSensitivity;
                          float zoomBotoes = (TInput.GetKey(KeyCode.Equals) ? 1f : 0f) - (TInput.GetKey(KeyCode.Minus) ? 1f : 0f);
                          _zoomDistance -= zoomBotoes * 3f * Time.deltaTime;
                      }
                      else
                      {
                          HorizontalAxis += Input.GetAxis("Mouse X") * _mouseSensitivity;
                          VerticalAxis -= Input.GetAxis("Mouse Y") * _mouseSensitivity;
                          _zoomDistance -= Input.GetAxis("Mouse ScrollWheel") * Time.deltaTime * _zoomSpeed;
                      }
                      _playerMovement.SetCameraAxis(HorizontalAxis);
                      VerticalAxis = Mathf.Clamp(VerticalAxis, _verticalMinLimit, _verticalMaxLimit);
                      _currentRotation = Vector3.SmoothDamp(_currentRotation, new Vector3(VerticalAxis, HorizontalAxis), ref _currentRotationVelocity, _rotationSmoothTime);
                      base.transform.eulerAngles = _currentRotation;
                      _zoomDistance = Mathf.Clamp(_zoomDistance, _zoomMinimumDistance, _zoomMaximumDistance);
                      base.transform.position = _targetTransform.position - base.transform.forward * _zoomDistance + _targetHeightOffset;
                  }

                  public void SetTarget(Transform targetTransform, float targetHeight)
                  {
                      _targetTransform = targetTransform;
                      _targetHeight = targetHeight;
                      HorizontalAxis = _targetTransform.eulerAngles.y;
                      VerticalAxis = _targetTransform.eulerAngles.x;
                  }
              }
          }
