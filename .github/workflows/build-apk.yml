                  Player.GetComponent<KillSystem21>().enabled = false;
              }
          }
          CSFIX11EOF
          colocar "KillSystem15.cs" <<'CSFIX12EOF'
          using System.Collections;
          using ControlFreak2;
          using UnityEngine;

          public class KillSystem15 : MonoBehaviour
          {
              public GameObject Player;

              public PlayerScriptByMiliko Move;

              public Animation PlayerAnim;

              public GameObject Debug;

              [Range(0.4f, 10f)]
              public float Distance;

              private void Start()
              {
                  PlayerAnim.GetComponent<Animation>();
              }

              private void Update()
              {
                  if (Vector3.Distance(Player.transform.position, Player.transform.position) < Distance && TInput.GetKeyDown(KeyCode.Return))
                  {
                      StartCoroutine(Kill());
                  }
              }

              private IEnumerator Kill()
              {
                  Move.enabled = true;
                  yield return new WaitForSeconds(0.1f);
                  Debug.SetActive(value: false);
                  Player.GetComponent<KillSystem10>().enabled = false;
                  Player.GetComponent<KillSystem11>().enabled = false;
                  Player.GetComponent<KillSystem16>().enabled = false;
                  Player.GetComponent<KillSystem13>().enabled = false;
                  Player.GetComponent<KillSystem18>().enabled = false;
                  Player.GetComponent<KillSystem15>().enabled = false;
                  Player.GetComponent<KillSystem14>().enabled = true;
                  Player.GetComponent<KillSystem21>().enabled = true;
              }
          }
          CSFIX12EOF

      - name: Reparar scripts decompilados (nomes gerados pelo compilador)
        run: |
          python3 - <<'PYEOF'
          import re
          from pathlib import Path
          mudados = 0
          for p in Path("project/Assets").rglob("*.cs"):
              try:
                  t = p.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              # <Nome>k__BackingField, <Start>d__5  ->  _Nome_k__BackingField, _Start_d__5
              n = re.sub(r"<([A-Za-z_]\w*)>(\w*__\w*)", r"_\1_\2", t)
              # <>c__DisplayClass1_0, <>1__state  ->  _c__DisplayClass1_0, _1__state
              n = re.sub(r"<>([A-Za-z0-9_]\w*)", r"_\1", n)
              if n != t:
                  p.write_text(n, encoding="utf-8")
                  mudados += 1
          print("Scripts reparadas (nomes gerados pelo compilador):", mudados)
          PYEOF

      - name: Corrigir shaders do TextMeshPro (o AssetRipper exporta vazios e o texto vira retangulo)
        run: |
          trocar() {
            # $1 = nome do arquivo .shader exportado; o shader certo vem pela entrada
            alvo=$(find project/Assets -type f -name "$1" | head -n 1)
            if [ -z "$alvo" ]; then echo "AVISO: $1 nao encontrado, nada trocado"; cat > /dev/null; return 0; fi
            cat > "$alvo"
            echo "shader arrumado: $alvo"
          }
          trocar "TextMeshPro_Mobile_Distance Field.shader" <<'TMPSDFEOF'
          Shader "TextMeshPro/Mobile/Distance Field" {
              Properties {
                  [HDR] _FaceColor ("Face Color", Color) = (1,1,1,1)
                  _FaceDilate ("Face Dilate", Range(-1,1)) = 0
                  [HDR] _OutlineColor ("Outline Color", Color) = (0,0,0,1)
                  _OutlineWidth ("Outline Thickness", Range(0,1)) = 0
                  _OutlineSoftness ("Outline Softness", Range(0,1)) = 0
                  [HDR] _UnderlayColor ("Border Color", Color) = (0,0,0,.5)
                  _UnderlayOffsetX ("Border OffsetX", Range(-1,1)) = 0
                  _UnderlayOffsetY ("Border OffsetY", Range(-1,1)) = 0
                  _UnderlayDilate ("Border Dilate", Range(-1,1)) = 0
                  _UnderlaySoftness ("Border Softness", Range(0,1)) = 0
                  _WeightNormal ("Weight Normal", Float) = 0
                  _WeightBold ("Weight Bold", Float) = .5
                  _ShaderFlags ("Flags", Float) = 0
                  _ScaleRatioA ("Scale RatioA", Float) = 1
                  _ScaleRatioB ("Scale RatioB", Float) = 1
                  _ScaleRatioC ("Scale RatioC", Float) = 1
                  _MainTex ("Font Atlas", 2D) = "white" {}
                  _TextureWidth ("Texture Width", Float) = 512
                  _TextureHeight ("Texture Height", Float) = 512
                  _GradientScale ("Gradient Scale", Float) = 5
                  _ScaleX ("Scale X", Float) = 1
                  _ScaleY ("Scale Y", Float) = 1
                  _PerspectiveFilter ("Perspective Correction", Range(0, 1)) = 0.875
                  _Sharpness ("Sharpness", Range(-1,1)) = 0
                  _VertexOffsetX ("Vertex OffsetX", Float) = 0
                  _VertexOffsetY ("Vertex OffsetY", Float) = 0
                  _ClipRect ("Clip Rect", Vector) = (-32767, -32767, 32767, 32767)
                  _MaskSoftnessX ("Mask SoftnessX", Float) = 0
                  _MaskSoftnessY ("Mask SoftnessY", Float) = 0
                  _StencilComp ("Stencil Comparison", Float) = 8
                  _Stencil ("Stencil ID", Float) = 0
                  _StencilOp ("Stencil Operation", Float) = 0
                  _StencilWriteMask ("Stencil Write Mask", Float) = 255
                  _StencilReadMask ("Stencil Read Mask", Float) = 255
                  _CullMode ("Cull Mode", Float) = 0
                  _ColorMask ("Color Mask", Float) = 15
              }

              SubShader {
                  Tags { "Queue"="Transparent" "IgnoreProjector"="True" "RenderType"="Transparent" }

                  Stencil {
                      Ref [_Stencil]
                      Comp [_StencilComp]
                      Pass [_StencilOp]
                      ReadMask [_StencilReadMask]
                      WriteMask [_StencilWriteMask]
                  }

                  Cull [_CullMode]
                  ZWrite Off
                  Lighting Off
                  Fog { Mode Off }
                  ZTest [unity_GUIZTestMode]
                  Blend One OneMinusSrcAlpha
                  ColorMask [_ColorMask]

                  Pass {
                      CGPROGRAM
                      #pragma vertex vert
                      #pragma fragment frag
                      #pragma target 3.0
                      #pragma multi_compile __ UNITY_UI_CLIP_RECT

                      #include "UnityCG.cginc"
                      #include "UnityUI.cginc"

                      struct appdata_t {
                          float4 vertex : POSITION;
                          fixed4 color : COLOR;
                          float2 texcoord : TEXCOORD0;
                      };

                      struct v2f {
                          float4 vertex : SV_POSITION;
                          fixed4 color : COLOR;
                          float2 texcoord : TEXCOORD0;
                          float4 localPos : TEXCOORD1;
                      };

                      sampler2D _MainTex;
                      fixed4 _FaceColor;
                      fixed4 _OutlineColor;
                      float _FaceDilate;
                      float _OutlineWidth;
                      float _VertexOffsetX;
                      float _VertexOffsetY;
                      float4 _ClipRect;

                      v2f vert (appdata_t v)
                      {
                          v2f o;
                          float4 p = v.vertex;
                          p.x += _VertexOffsetX;
                          p.y += _VertexOffsetY;
                          o.localPos = p;
                          o.vertex = UnityObjectToClipPos(p);
                          o.color = v.color;
                          o.texcoord = v.texcoord;
                          return o;
                      }

                      fixed4 frag (v2f i) : SV_Target
                      {
                          // O atlas do texto guarda a distancia ate a borda da letra no canal alfa (0.5 = borda)
                          half d = tex2D(_MainTex, i.texcoord).a;
                          half aa = max(fwidth(d) * 0.75h, 0.02h);
                          half edge = 0.5h - _FaceDilate * 0.25h;
                          half face = smoothstep(edge - aa, edge + aa, d);

                          fixed4 faceCol = i.color * _FaceColor;
                          faceCol.rgb *= faceCol.a;
                          fixed4 col = faceCol * face;

                          if (_OutlineWidth > 0.001)
                          {
                              half outerEdge = max(edge - _OutlineWidth * 0.5h, 0.02h);
                              half outer = smoothstep(outerEdge - aa, outerEdge + aa, d);
                              fixed4 oc = _OutlineColor;
                              oc.a *= i.color.a;
                              oc.rgb *= oc.a;
                              col = lerp(oc, faceCol, face) * outer;
                          }

                          #ifdef UNITY_UI_CLIP_RECT
                          col *= UnityGet2DClipping(i.localPos.xy, _ClipRect);
                          #endif

                          return col;
                      }
                      ENDCG
                  }
              }
              Fallback "UI/Default"
          }
          TMPSDFEOF
          trocar "TextMeshPro_Sprite.shader" <<'TMPSPREOF'
          Shader "TextMeshPro/Sprite" {
              Properties {
                  [PerRendererData] _MainTex ("Sprite Texture", 2D) = "white" {}
                  _Color ("Tint", Color) = (1,1,1,1)
                  _StencilComp ("Stencil Comparison", Float) = 8
                  _Stencil ("Stencil ID", Float) = 0
                  _StencilOp ("Stencil Operation", Float) = 0
                  _StencilWriteMask ("Stencil Write Mask", Float) = 255
                  _StencilReadMask ("Stencil Read Mask", Float) = 255
                  _CullMode ("Cull Mode", Float) = 0
                  _ColorMask ("Color Mask", Float) = 15
                  _ClipRect ("Clip Rect", Vector) = (-32767, -32767, 32767, 32767)
                  [Toggle(UNITY_UI_ALPHACLIP)] _UseUIAlphaClip ("Use Alpha Clip", Float) = 0
              }

              SubShader {
                  Tags { "Queue"="Transparent" "IgnoreProjector"="True" "RenderType"="Transparent" "PreviewType"="Plane" "CanUseSpriteAtlas"="True" }

                  Stencil {
                      Ref [_Stencil]
                      Comp [_StencilComp]
                      Pass [_StencilOp]
                      ReadMask [_StencilReadMask]
                      WriteMask [_StencilWriteMask]
                  }

                  Cull [_CullMode]
                  ZWrite Off
                  Lighting Off
                  Fog { Mode Off }
                  ZTest [unity_GUIZTestMode]
                  Blend SrcAlpha OneMinusSrcAlpha
                  ColorMask [_ColorMask]

                  Pass {
                      CGPROGRAM
                      #pragma vertex vert
                      #pragma fragment frag
                      #pragma multi_compile __ UNITY_UI_CLIP_RECT
                      #pragma multi_compile __ UNITY_UI_ALPHACLIP

                      #include "UnityCG.cginc"
                      #include "UnityUI.cginc"

                      struct appdata_t {
                          float4 vertex : POSITION;
                          fixed4 color : COLOR;
                          float2 texcoord : TEXCOORD0;
                      };

                      struct v2f {
                          float4 vertex : SV_POSITION;
                          fixed4 color : COLOR;
                          float2 texcoord : TEXCOORD0;
                          float4 localPos : TEXCOORD1;
                      };

                      sampler2D _MainTex;
                      fixed4 _Color;
                      float4 _ClipRect;

                      v2f vert (appdata_t v)
                      {
                          v2f o;
                          o.localPos = v.vertex;
                          o.vertex = UnityObjectToClipPos(v.vertex);
                          o.color = v.color * _Color;
                          o.texcoord = v.texcoord;
                          return o;
                      }

                      fixed4 frag (v2f i) : SV_Target
                      {
                          fixed4 col = tex2D(_MainTex, i.texcoord) * i.color;

                          #ifdef UNITY_UI_CLIP_RECT
                          col.a *= UnityGet2DClipping(i.localPos.xy, _ClipRect);
                          #endif

                          #ifdef UNITY_UI_ALPHACLIP
                          clip(col.a - 0.001);
                          #endif

                          return col;
                      }
                      ENDCG
                  }
              }
              Fallback "UI/Default"
          }
          TMPSPREOF

      - name: Trocar leituras de teclado pelas que aceitam toque
        run: |
          cd project/Assets
          [ -d Scripts ] && cd Scripts
          grep -rlZE --exclude-dir=Editor --include=*.cs '(CF2Input|Input)\.(GetKeyDown|GetKeyUp|GetKey|GetAxisRaw|GetAxis)\(' . | xargs -0 -r perl -pi -e 's/(?<![\.\w])(?:UnityEngine\.)?(?:CF2Input|Input)\.(GetKeyDown|GetKeyUp|GetKey|GetAxisRaw|GetAxis)\(/TInput.$1(/g'
          echo "Chamadas trocadas: $(grep -rho --include=*.cs 'TInput\.Get' . | wc -l)"
          echo "Chamadas originais restantes (Input/CF2Input, fora de Editor): $(grep -rhoE --exclude-dir=Editor --include=*.cs '(^|[^.A-Za-z_])(UnityEngine\.)?(CF2Input|Input)\.(GetKeyDown|GetKeyUp|GetKey|GetAxisRaw|GetAxis)\(' . | wc -l)"
          grep -rnE --exclude-dir=Editor --include=*.cs '(^|[^.A-Za-z_])(UnityEngine\.)?(CF2Input|Input)\.(GetKeyDown|GetKeyUp|GetKey|GetAxisRaw|GetAxis)\(' . | head -20 || true
          echo "Scripts que usam mouse direto (posicao/clique): $(grep -rlE --include=*.cs 'Input\.(mousePosition|GetMouseButton)' . | wc -l)"

      - name: Camera principal olha so pelo toque (ignora o joystick)
        run: |
          cd project/Assets
          [ -d Scripts ] && cd Scripts
          find . -iname '*camera*.cs' ! -path '*/Editor/*' -print0 | while IFS= read -r -d '' f; do
            perl -pi -e 's/TInput\.GetAxisRaw\(/TInput.CamAxis(/g; s/TInput\.GetAxis\(/TInput.CamAxis(/g' "$f"
            echo "camera ajustada: $f"
          done
          echo "--- arquivos que leem eixos Horizontal/Vertical/Mouse:"
          grep -rlE --include=*.cs 'TInput\.(GetAxis|GetAxisRaw|CamAxis)\("(Horizontal|Vertical|Mouse X|Mouse Y)"' . | head -30 || true

      - name: Corrigir pasta de configuracao no Android
        run: |
          cd project/Assets
          [ -d Scripts ] && cd Scripts
          grep -rlZE --exclude-dir=Editor --include=*.cs 'Environment\.GetFolderPath' . | xargs -0 -r perl -pi -e 's/Environment\.GetFolderPath\(Environment\.SpecialFolder\.(MyDocuments|Personal|ApplicationData|LocalApplicationData|DesktopDirectory)\)/Application.persistentDataPath/g'
          echo "persistentDataPath em: $(grep -rl --include=*.cs 'Application.persistentDataPath' . | wc -l) arquivos"

      - name: Ler a versao da Unity do projeto exportado
        id: unityver
        run: |
          V=$(grep -m1 '^m_EditorVersion:' project/ProjectSettings/ProjectVersion.txt | sed 's/^m_EditorVersion:[[:space:]]*//' | tr -d '\r ')
          test -n "$V" || { echo "Versao da Unity nao encontrada no ProjectVersion.txt"; exit 1; }
          echo "Unity do projeto: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Instalar a Unity do projeto (com modulo Android)
        uses: RageAgainstThePixel/unity-setup@v1
        with:
          version-file: None
          unity-version: ${{ steps.unityver.outputs.version }}
          build-targets: Android

      - name: Ativar licenca Personal
        uses: RageAgainstThePixel/activate-unity-license@v1
        with:
          license: personal
          username: "opsariel123@gmail.com"
          password: "Y_6anderes"

      - name: Compilar o APK
        uses: RageAgainstThePixel/unity-action@v1
        with:
          log-name: build-apk
          args: -quit -batchmode -nographics -projectPath ${{ github.workspace }}/project -buildTarget Android -executeMethod CIBuild.Build

      - name: Enviar o APK
        uses: actions/upload-artifact@v4
        with:
          name: Agniezka-APK
          path: build/*.apk
          if-no-files-found: error

      - name: Diagnostico do Unity Hub
        if: always()
        run: |
          dpkg -l | grep -i unityhub || echo "pacote unityhub NAO instalado"
          dpkg -L unityhub 2>/dev/null | head -40 || true
          ls -la /opt || true
          ls -la /opt/unityhub 2>/dev/null | head -30 || echo "sem /opt/unityhub"
          apt-cache policy unityhub | head -10 || true

      - name: Resumo dos erros do Unity
        if: failure()
        run: |
          LOGS="$HOME/.config/unity3d/Editor.log $(find "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$HOME" -name '*.log' -size +200k 2>/dev/null | head -5)"
          for f in $LOGS; do
            [ -f "$f" ] || continue
            echo "=============== $f ($(wc -l < "$f") linhas)"
            echo "--- erros de compilacao (error CS):"
            grep -E "error CS[0-9]+" "$f" | sed 's/^.*Assets\//Assets\//' | awk '!seen[$0]++' | head -40
            echo "--- total de linhas com error CS: $(grep -cE 'error CS[0-9]+' "$f")"
            echo "--- outras falhas:"
            grep -nE "Scripts have compiler errors|Build Failed|BuildFailedException|Aborting batchmode|Android SDK|NDK|Gradle|FAILURE|Exception:" "$f" | awk '!seen[$0]++' | head -30
          done
