      - name: Criar shaders toon (contorno fino)
        run: |
          mkdir -p project/Assets/Resources
          cat > project/Assets/Resources/NoOutlineToon.shader <<'SHEOF1'
          Shader "Custom/NoOutlineToon"
          {
              Properties
              {
                  _MainTex ("Texture", 2D) = "white" {}
                  _Color ("Color", Color) = (1,1,1,1)
                  _Cutoff ("Cutoff", Range(0,1)) = 0
                  _SrcBlend ("Src", Float) = 1
                  _DstBlend ("Dst", Float) = 0
                  _ZWrite ("ZWrite", Float) = 1
                  _Cull ("Cull", Float) = 2
                  _OutlineWidth ("Outline Width", Float) = 0
                  _OutlineColor ("Outline Color", Color) = (0,0,0,1)
              }
              SubShader
              {
                  Tags { "RenderType"="Opaque" }
                  Pass
                  {
                      Tags { "LightMode"="ForwardBase" }
                      Blend [_SrcBlend] [_DstBlend]
                      ZWrite [_ZWrite]
                      Cull [_Cull]
                      CGPROGRAM
                      #pragma vertex vert
                      #pragma fragment frag
                      #include "UnityCG.cginc"
                      sampler2D _MainTex;
                      float4 _MainTex_ST;
                      fixed4 _Color;
                      fixed _Cutoff;
                      struct v2f
                      {
                          float4 pos : SV_POSITION;
                          float2 uv : TEXCOORD0;
                          fixed shade : TEXCOORD1;
                      };
                      v2f vert (appdata_base v)
                      {
                          v2f o;
                          o.pos = UnityObjectToClipPos(v.vertex);
                          o.uv = TRANSFORM_TEX(v.texcoord, _MainTex);
                          float3 n = UnityObjectToWorldNormal(v.normal);
                          float3 l = normalize(_WorldSpaceLightPos0.xyz + float3(0, 0.0001, 0));
                          float nl = dot(n, l) * 0.5 + 0.5;
                          o.shade = lerp(0.6, 1.0, smoothstep(0.3, 0.6, nl));
                          return o;
                      }
                      fixed4 frag (v2f i) : SV_Target
                      {
                          fixed4 c = tex2D(_MainTex, i.uv) * _Color;
                          clip(c.a - _Cutoff);
                          c.rgb *= i.shade;
                          return c;
                      }
                      ENDCG
                  }
                  Pass
                  {
                      Cull Front
                      CGPROGRAM
                      #pragma vertex vertO
                      #pragma fragment fragO
                      #include "UnityCG.cginc"
                      float _OutlineWidth;
                      fixed4 _OutlineColor;
                      struct v2fo
                      {
                          float4 pos : SV_POSITION;
                      };
                      v2fo vertO (appdata_base v)
                      {
                          v2fo o;
                          o.pos = UnityObjectToClipPos(v.vertex);
                          if (_OutlineWidth <= 0.0)
                          {
                              o.pos = float4(2.0, 2.0, 2.0, 1.0);
                              return o;
                          }
                          float3 norm = mul((float3x3)UNITY_MATRIX_IT_MV, v.normal);
                          float2 dir = TransformViewToProjection(norm.xy);
                          float dl = length(dir);
                          dir = (dl > 0.00001) ? (dir / dl) : float2(0.0, 0.0);
                          dir.x *= _ScreenParams.y / _ScreenParams.x;
                          o.pos.xy += dir * o.pos.w * _OutlineWidth;
                          return o;
                      }
                      fixed4 fragO (v2fo i) : SV_Target
                      {
                          return _OutlineColor;
                      }
                      ENDCG
                  }
              }
          }
          SHEOF1
          cat > project/Assets/Resources/Invisible.shader <<'SHEOF2'
          Shader "Custom/Invisible"
          {
              SubShader
              {
                  Tags { "Queue"="Geometry" "RenderType"="Opaque" }
                  Pass
                  {
                      ZWrite Off
                      ColorMask 0
                      CGPROGRAM
                      #pragma vertex vert
                      #pragma fragment frag
                      #include "UnityCG.cginc"
                      struct v2f { float4 pos : SV_POSITION; };
                      v2f vert (float4 v : POSITION)
                      {
                          v2f o;
                          o.pos = UnityObjectToClipPos(v);
                          return o;
                      }
                      fixed4 frag (v2f i) : SV_Target { return fixed4(0, 0, 0, 0); }
                      ENDCG
                  }
              }
          }
