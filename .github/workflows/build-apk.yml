      - name: Criar o corretor automatico de erros (ugui, TextMeshPro, pacotes e scripts)
        run: |
          cat > "$RUNNER_TEMP/fix_unity_errors.py" <<'FIXEOF'
          #!/usr/bin/env python3
          """Corretor automatico de erros de build da Unity (ugui, TextMeshPro, pacotes e scripts).

          Le o log mais novo em Logs/*.log, descobre o que quebrou e conserta o projeto.
          Escreve changed=true|false em $GITHUB_OUTPUT: se true, o workflow compila de novo.
          """
          import json
          import os
          import re
          import shutil
          import urllib.request
          from pathlib import Path

          PROJ = Path(os.environ.get("PROJECT_DIR", "project"))
          LOG_DIR = Path(os.environ.get("LOG_DIR", "Logs"))
          QUAR = PROJ.parent / "_scripts_com_erro"
          changes = []


          def say(msg):
              print(msg, flush=True)


          def note(msg):
              changes.append(msg)
              say("  [corrigido] " + msg)


          # ----------------------------------------------------------------- versao da Unity
          def unity_version():
              try:
                  t = (PROJ / "ProjectSettings" / "ProjectVersion.txt").read_text(errors="ignore")
                  m = re.search(r"m_EditorVersion:\s*(\d+)\.(\d+)", t)
                  if m:
                      return int(m.group(1)), int(m.group(2))
              except Exception:
                  pass
              return 2019, 4


          UVER = unity_version()

          # ----------------------------------------------------------------- manifest / pacotes
          MANIFEST = PROJ / "Packages" / "manifest.json"


          def load_manifest():
              try:
                  return json.loads(MANIFEST.read_text(encoding="utf-8-sig"))
              except Exception:
                  return {"dependencies": {}}


          def save_manifest(m):
              MANIFEST.parent.mkdir(parents=True, exist_ok=True)
              MANIFEST.write_text(json.dumps(m, indent=2), encoding="utf-8")


          def vt(v):
              return tuple(int(x) for x in re.findall(r"\d+", v.split("-")[0])[:3])


          def registry(pkg):
              try:
                  with urllib.request.urlopen("https://packages.unity.com/" + pkg, timeout=25) as r:
                      return json.load(r)
              except Exception as e:
                  say("  (registro da Unity indisponivel para %s: %s)" % (pkg, e))
                  return None


          FALLBACK = {
              "com.unity.ugui": [((2023, 2), "2.0.0"), ((2019, 2), "1.0.0")],
              "com.unity.textmeshpro": [((2020, 1), "3.0.6"), ((2019, 3), "2.1.6"), ((2018, 3), "1.4.1")],
              "com.unity.timeline": [((2019, 3), "1.4.8"), ((2018, 4), "1.2.18")],
              "com.unity.cinemachine": [((2019, 4), "2.8.9"), ((2018, 4), "2.6.11")],
              "com.unity.postprocessing": [((2019, 4), "3.2.2"), ((2018, 4), "2.3.0")],
          }


          def pick_version(pkg):
              data = registry(pkg)
              if data and isinstance(data.get("versions"), dict):
                  best = None
                  for v, meta in data["versions"].items():
                      if "-" in v:
                          continue
                      u = (meta or {}).get("unity", "0.0")
                      mm = re.match(r"(\d+)\.(\d+)", str(u))
                      need = (int(mm.group(1)), int(mm.group(2))) if mm else (0, 0)
                      if need <= UVER and (best is None or vt(v) > vt(best)):
                          best = v
                  if best:
                      return best
              for need, v in FALLBACK.get(pkg, []):
                  if UVER >= need:
                      return v
              return None


          def ensure_pkg(pkg, why):
              """Poe o pacote no manifest se ainda nao estiver."""
              if UVER < (2018, 1):
                  return False
              m = load_manifest()
              deps = m.setdefault("dependencies", {})
              if pkg in deps:
                  return False
              if pkg.startswith("com.unity.modules."):
                  if UVER < (2019, 1):
                      return False
                  ver = "1.0.0"
              else:
                  ver = pick_version(pkg)
                  if not ver:
                      say("  (nao achei versao do pacote %s para a Unity %d.%d)" % (pkg, UVER[0], UVER[1]))
                      return False
              deps[pkg] = ver
              save_manifest(m)
              note("pacote %s %s adicionado (%s)" % (pkg, ver, why))
              return True


          def remove_dll(name, why):
              """Apaga uma DLL (e o .meta) dentro de Assets quando ela duplica um pacote."""
              hit = False
              for p in (PROJ / "Assets").rglob("*"):
                  if p.is_file() and p.name.lower() == name.lower():
                      try:
                          p.unlink()
                          meta = p.with_name(p.name + ".meta")
                          if meta.exists():
                              meta.unlink()
                          note("DLL removida: %s (%s)" % (p.relative_to(PROJ), why))
                          hit = True
                      except Exception as e:
                          say("  (nao consegui apagar %s: %s)" % (p, e))
              return hit


          # ----------------------------------------------------------------- tabelas
          NS_PKG = {  # nome de namespace -> pacote que o traz
              "UI": "com.unity.ugui", "EventSystems": "com.unity.ugui",
              "TMPro": "com.unity.textmeshpro",
              "Cinemachine": "com.unity.cinemachine",
              "Timeline": "com.unity.timeline",
              "PostProcessing": "com.unity.postprocessing",
              "Mathematics": "com.unity.mathematics",
              "Burst": "com.unity.burst",
              "Collections": "com.unity.collections",
              "InputSystem": "com.unity.inputsystem",
              "Purchasing": "com.unity.purchasing",
              "Advertisements": "com.unity.ads",
              "AddressableAssets": "com.unity.addressables",
              "ResourceManagement": "com.unity.addressables",
              "Localization": "com.unity.localization",
              "ProBuilder": "com.unity.probuilder",
              "VisualScripting": "com.unity.visualscripting",
              "Playables": "com.unity.modules.director",
              "AI": "com.unity.modules.ai",
              "Video": "com.unity.modules.video",
              "Tilemaps": "com.unity.modules.tilemap",
          }
          TYPE_PKG = {  # tipos soltos -> pacote
              "TextMeshProUGUI": "com.unity.textmeshpro", "TMP_Text": "com.unity.textmeshpro",
              "TMP_InputField": "com.unity.textmeshpro", "TMP_Dropdown": "com.unity.textmeshpro",
              "TMP_FontAsset": "com.unity.textmeshpro",
              "Graphic": "com.unity.ugui", "Selectable": "com.unity.ugui", "RawImage": "com.unity.ugui",
              "ScrollRect": "com.unity.ugui", "CanvasScaler": "com.unity.ugui", "GraphicRaycaster": "com.unity.ugui",
              "EventSystem": "com.unity.ugui", "StandaloneInputModule": "com.unity.ugui",
              "PointerEventData": "com.unity.ugui", "IPointerClickHandler": "com.unity.ugui",
              "CinemachineVirtualCamera": "com.unity.cinemachine", "CinemachineBrain": "com.unity.cinemachine",
              "PlayableDirector": "com.unity.modules.director", "TimelineAsset": "com.unity.timeline",
              "NavMeshAgent": "com.unity.modules.ai", "NavMesh": "com.unity.modules.ai",
              "VideoPlayer": "com.unity.modules.video", "Tilemap": "com.unity.modules.tilemap",
              "PostProcessVolume": "com.unity.postprocessing", "PostProcessLayer": "com.unity.postprocessing",
          }
          ASM_PKG = {  # nome de assembly -> pacote
              "UnityEngine.UI": "com.unity.ugui", "Unity.TextMeshPro": "com.unity.textmeshpro",
              "Unity.Timeline": "com.unity.timeline", "Cinemachine": "com.unity.cinemachine",
              "Unity.Postprocessing.Runtime": "com.unity.postprocessing", "Unity.Mathematics": "com.unity.mathematics",
              "Unity.Burst": "com.unity.burst", "Unity.Collections": "com.unity.collections",
              "Unity.InputSystem": "com.unity.inputsystem", "Unity.Addressables": "com.unity.addressables",
              "Unity.ResourceManager": "com.unity.addressables",
          }
          DUP_CODES = {"CS0433", "CS0121", "CS0104", "CS0101", "CS0111", "CS0229", "CS0200"}
          DUP_DLL = [  # palavra na mensagem/arquivo -> (dlls duplicadas, pacote que fica no lugar)
              (r"TMPro|TextMeshPro", ["Unity.TextMeshPro.dll", "Unity.TextMeshPro.Editor.dll"], "com.unity.textmeshpro"),
              (r"UnityEngine\.UI|EventSystems|DefaultControls|com\.unity\.ugui|UnityEditor\.UI", ["UnityEngine.UI.dll", "UnityEditor.UI.dll"], "com.unity.ugui"),
              (r"Cinemachine", ["Cinemachine.dll"], "com.unity.cinemachine"),
              (r"UnityEngine\.Timeline|TimelineAsset", ["Unity.Timeline.dll", "Unity.Timeline.Editor.dll"], "com.unity.timeline"),
              (r"PostProcessing", ["Unity.Postprocessing.Runtime.dll", "Unity.Postprocessing.Editor.dll"], "com.unity.postprocessing"),
          ]
          PROTECTED = ("TouchControls", "CIBuild", "MobileControls", "MobileTune", "MobileFixer", "TInput")

          # ----------------------------------------------------------------- ler o log
          def newest_log():
              logs = sorted(LOG_DIR.glob("*.log"), key=lambda p: p.stat().st_mtime) if LOG_DIR.exists() else []
              return logs[-1] if logs else None


          def main():
              say("== Corretor automatico de erros (Unity %d.%d) ==" % UVER)
              lg = newest_log()
              if not lg:
                  say("Nenhum log em %s; nada a corrigir." % LOG_DIR)
                  return finish(False)
              text = lg.read_text(errors="ignore")
              say("Log analisado: %s (%d linhas)" % (lg, text.count("\n")))

              errs = {}
              for m in re.finditer(r"(?P<file>[^\s()\"']+\.cs)\((?P<l>\d+),(?P<c>\d+)\): error (?P<code>CS\d+): (?P<msg>[^\n\"]*)", text):
                  errs[(m.group("file"), m.group("code"), m.group("msg"))] = m.group("l")
              say("Erros de compilacao distintos: %d" % len(errs))

              # 1) DLLs em Assets que duplicam pacotes (ugui, TextMeshPro, Timeline...)
              dup_found = [(f, c, msg) for (f, c, msg) in errs if c in DUP_CODES]
              for rx, dlls, pkg in DUP_DLL:
                  if any(re.search(rx, msg + " " + f) for f, c, msg in dup_found):
                      gone = False
                      for d in dlls:
                          gone = remove_dll(d, "duplicava o pacote %s" % pkg) or gone
                      if gone:
                          ensure_pkg(pkg, "no lugar da DLL removida")
              for f, c, msg in dup_found:  # CS0433 diz o nome exato dos dois assemblies
                  if c == "CS0433":
                      for asm in re.findall(r"'([\w\.]+), Version=", msg):
                          if asm in ASM_PKG and remove_dll(asm + ".dll", "CS0433 duplicada"):
                              ensure_pkg(ASM_PKG[asm], "no lugar da DLL removida")

              # 2) namespace ou tipo que falta -> pacote certo
              for f, c, msg in errs:
                  if c not in ("CS0246", "CS0234", "CS0400", "CS0103"):
                      continue
                  for name in re.findall(r"namespace name '(\w+)'", msg):
                      if name in NS_PKG:
                          ensure_pkg(NS_PKG[name], "faltava o namespace " + name)
                      elif name in TYPE_PKG:
                          ensure_pkg(TYPE_PKG[name], "faltava o tipo " + name)
                  for name in re.findall(r"name '(\w+)' does not exist", msg):
                      if name in TYPE_PKG:
                          ensure_pkg(TYPE_PKG[name], "faltava o tipo " + name)
              # Unity 2023.2+ trouxe o TextMeshPro para dentro do ugui 2.x
              m = load_manifest()
              if UVER >= (2023, 2) and "com.unity.textmeshpro" in m.get("dependencies", {}):
                  del m["dependencies"]["com.unity.textmeshpro"]
                  save_manifest(m)
                  note("pacote com.unity.textmeshpro removido (na Unity %d.%d ele vem dentro do ugui)" % UVER)
                  ensure_pkg("com.unity.ugui", "traz o TextMeshPro")

              # 3) DLL que referencia assembly que nao existe
              for asm in set(re.findall(r"Reference has errors '([\w\.]+)'", text) + re.findall(r"Unable to resolve reference '([\w\.]+)'", text)):
                  if asm in ASM_PKG:
                      ensure_pkg(ASM_PKG[asm], "uma DLL precisava de " + asm)

              # 4) pacote impossivel de resolver no manifest
              inv = set(re.findall(r"(com\.[\w\.\-]+): Package \[[^\]]*\] cannot be found", text))
              inv |= set(re.findall(r"Cannot (?:find|resolve) package\s+'?(com\.[\w\.\-]+)", text))
              if inv:
                  m = load_manifest()
                  for pkg in inv:
                      if pkg in m.get("dependencies", {}):
                          if pkg.startswith("com.unity.") and not pkg.startswith("com.unity.modules."):
                              v = pick_version(pkg)
                              if v and v != m["dependencies"][pkg]:
                                  m["dependencies"][pkg] = v
                                  note("pacote %s trocado para a versao %s" % (pkg, v))
                                  continue
                          del m["dependencies"][pkg]
                          note("pacote %s removido do manifest (nao existe/nao resolve)" % pkg)
                  save_manifest(m)

              # 5) projeto exportado para o Input System novo, mas o jogo usa o Input antigo
              if "using the UnityEngine.Input class" in text or "switched active Input handling" in text:
                  ps = PROJ / "ProjectSettings" / "ProjectSettings.asset"
                  if ps.exists():
                      t = ps.read_text(errors="ignore")
                      n = re.sub(r"activeInputHandler:\s*\d", "activeInputHandler: 2", t)
                      if n != t:
                          ps.write_text(n, encoding="utf-8")
                          note("Active Input Handling = Both (o jogo mistura Input antigo e novo)")

              # 6) script com defeito que sobrou: tira do projeto (vai para _scripts_com_erro)
              if not changes:
                  bad = {}
                  for (f, c, msg), _ in errs.items():
                      g = f.replace("\\", "/")
                      i = g.find("Assets/")
                      if i < 0 or "/PackageCache/" in g or "BuiltInPackages" in g:
                          continue
                      rel = g[i:]
                      if any(w in rel for w in PROTECTED):
                          continue
                      bad.setdefault(rel, []).append(c)
                  total = len(list((PROJ / "Assets").rglob("*.cs"))) or 1
                  if bad and len(bad) <= 40 and len(bad) <= total * 0.4:
                      for rel, codes in sorted(bad.items()):
                          src = PROJ / rel
                          if not src.exists():
                              continue
                          dst = QUAR / rel
                          dst.parent.mkdir(parents=True, exist_ok=True)
                          shutil.move(str(src), str(dst))
                          meta = src.with_name(src.name + ".meta")
                          if meta.exists():
                              meta.unlink()
                          note("script com erro tirado do build: %s (%s)" % (rel, ",".join(sorted(set(codes)))))
                  elif bad:
                      say("  %d scripts com erro (de %d): muitos para tirar com seguranca; nada removido." % (len(bad), total))

              finish(bool(changes))


          def finish(changed):
              say("Resumo: %d correcao(oes)%s" % (len(changes), "; vou compilar de novo." if changed else "; nada que eu saiba consertar."))
              summ = os.environ.get("GITHUB_STEP_SUMMARY")
              if summ and changes:
                  with open(summ, "a", encoding="utf-8") as fh:
                      fh.write("### Correcoes automaticas\n" + "\n".join("- " + c for c in changes) + "\n")
              out = os.environ.get("GITHUB_OUTPUT")
              if out:
                  with open(out, "a") as fh:
                      fh.write("changed=%s\n" % ("true" if changed else "false"))


          if __name__ == "__main__":
              main()
          FIXEOF
          python3 -m py_compile "$RUNNER_TEMP/fix_unity_errors.py" && echo "corretor pronto"

      - name: Compilar o APK
        id: build1
        continue-on-error: true
        uses: RageAgainstThePixel/unity-action@v1
        with:
          log-name: build-apk
          args: -quit -batchmode -nographics -projectPath ${{ github.workspace }}/project -buildTarget Android -executeMethod CIBuild.Build

      - name: Corrigir erros automaticamente (rodada 1)
        id: fix1
        if: steps.build1.outcome == 'failure'
        run: python3 "$RUNNER_TEMP/fix_unity_errors.py"

      - name: Compilar o APK de novo (tentativa 2)
        id: build2
        if: steps.fix1.outputs.changed == 'true'
        continue-on-error: true
        uses: RageAgainstThePixel/unity-action@v1
        with:
          log-name: build-apk-2
          args: -quit -batchmode -nographics -projectPath ${{ github.workspace }}/project -buildTarget Android -executeMethod CIBuild.Build

      - name: Corrigir erros automaticamente (rodada 2)
        id: fix2
        if: steps.build2.outcome == 'failure'
        run: python3 "$RUNNER_TEMP/fix_unity_errors.py"

      - name: Compilar o APK de novo (tentativa 3)
        id: build3
        if: steps.fix2.outputs.changed == 'true'
        continue-on-error: true
        uses: RageAgainstThePixel/unity-action@v1
        with:
          log-name: build-apk-3
          args: -quit -batchmode -nographics -projectPath ${{ github.workspace }}/project -buildTarget Android -executeMethod CIBuild.Build

      - name: Corrigir erros automaticamente (rodada 3)
        id: fix3
        if: steps.build3.outcome == 'failure'
        run: python3 "$RUNNER_TEMP/fix_unity_errors.py"

      - name: Compilar o APK de novo (tentativa 4)
        id: build4
        if: steps.fix3.outputs.changed == 'true'
        continue-on-error: true
        uses: RageAgainstThePixel/unity-action@v1
        with:
          log-name: build-apk-4
          args: -quit -batchmode -nographics -projectPath ${{ github.workspace }}/project -buildTarget Android -executeMethod CIBuild.Build

      - name: Reserva - preparar o projeto para a Unity 2020.3.48f1 (so se a build travou)
        if: steps.build1.outcome == 'failure' && steps.build2.outcome != 'success' && steps.build3.outcome != 'success' && steps.build4.outcome != 'success'
        run: |
          echo "A build com a Unity 2020.2.1f1 falhou; tentando de novo com 2020.3.48f1 (LTS da mesma linha)"
          rm -rf project/Library build
          printf 'm_EditorVersion: 2020.3.48f1\n' > project/ProjectSettings/ProjectVersion.txt

      - name: Reserva - instalar a Unity 2020.3.48f1
        if: steps.build1.outcome == 'failure' && steps.build2.outcome != 'success' && steps.build3.outcome != 'success' && steps.build4.outcome != 'success'
        uses: RageAgainstThePixel/unity-setup@v1
        with:
          version-file: None
          unity-version: 2020.3.48f1
          build-targets: Android

      - name: Reserva - compilar o APK
        if: steps.build1.outcome == 'failure' && steps.build2.outcome != 'success' && steps.build3.outcome != 'success' && steps.build4.outcome != 'success'
        uses: RageAgainstThePixel/unity-action@v1
        with:
          log-name: build-apk-reserva
          args: -quit -batchmode -nographics -projectPath ${{ github.workspace }}/project -buildTarget Android -executeMethod CIBuild.Build

      - name: Enviar o APK
        uses: actions/upload-artifact@v4
        with:
          name: Agniezka-APK
          path: build/*.apk
          if-no-files-found: error

      - name: Salvar o log completo da Unity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-log
          path: Logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Diagnostico do Unity Hub
        if: always()
        run: |
          dpkg -l | grep -i unityhub || echo "pacote unityhub NAO instalado"
          dpkg -L unityhub 2>/dev/null | head -40 || true
          ls -la /opt || true
          ls -la /opt/unityhub 2>/dev/null | head -30 || echo "sem /opt/unityhub"
          apt-cache policy unityhub | head -10 || true

      - name: Resumo dos erros do Unity
        if: failure()
        run: |
          LOGS="$HOME/.config/unity3d/Editor.log $(find "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$HOME" -name '*.log' -size +200k 2>/dev/null | head -5)"
          for f in $LOGS; do
            [ -f "$f" ] || continue
            echo "=============== $f ($(wc -l < "$f") linhas)"
            echo "--- erros de compilacao (error CS):"
            grep -E "error CS[0-9]+" "$f" | sed 's/^.*Assets\//Assets\//' | awk '!seen[$0]++' | head -40
            echo "--- total de linhas com error CS: $(grep -cE 'error CS[0-9]+' "$f")"
            echo "--- outras falhas:"
            grep -nE "Scripts have compiler errors|Build Failed|BuildFailedException|Aborting batchmode|Android SDK|NDK|Gradle|FAILURE|Exception:" "$f" | awk '!seen[$0]++' | head -30
            echo "--- ultimas etapas antes de cair:"
            grep -nE "Packaging assets|Caught fatal signal|Compiled shader|Building Library|il2cpp" "$f" | cut -c1-220 | tail -8
          done
