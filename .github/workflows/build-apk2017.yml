name: Decompilar e Build APK (qualquer versao da Unity)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release onde esta o arquivo do jogo"
        default: "jogo"
      arquivo:
        description: "Nome do arquivo do jogo (.zip ou .rar) dentro da release"
        default: "ys_2017_11_01.rz.rar"
      unity:
        description: "OPCIONAL: forcar uma versao da Unity (ex.: 2019.4.40f1). Vazio = usa a versao detectada no jogo"
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      ZIP_NAME: YanLite V1.zip
      APK_NAME: YanLite Simulator 2017.apk
      APP_NAME: YanLite Simulator 2017
      APP_ID: com.HonokoDev.YanLiteSimulator
      UNITY_THISISABUILDMACHINE: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - name: Verificacao previa (avisa os erros logo no comeco)
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ARQ: ${{ inputs.arquivo }}
        run: |
          ERROS=0
          erro() { echo "::error::$1"; ERROS=$((ERROS+1)); }
          ok() { echo "OK: $1"; }

          # 1) release e arquivo do jogo
          ASSETS=""
          if ASSETS=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>&1); then
            if echo "$ASSETS" | grep -qxF "$ARQ"; then
              ok "arquivo '$ARQ' encontrado na release '$TAG'"
            elif echo "$ASSETS" | grep -qiE '\.(zip|rar)$'; then
              echo "::warning::'$ARQ' nao esta na release; sera usado: $(echo "$ASSETS" | grep -iE '\.(zip|rar)$' | head -n 1)"
            else
              erro "A release '$TAG' nao tem nenhum .zip ou .rar do jogo (publique a release, nao deixe como rascunho)"
            fi
          else
            erro "Release '$TAG' nao encontrada neste repositorio: $ASSETS"
            ASSETS=""
          fi

          # 2) AssetRipper
          if echo "$ASSETS" | grep -qi '^AssetRipper'; then
            ok "AssetRipper encontrado na sua release"
          elif gh release view -R AssetRipper/AssetRipper --json assets -q '.assets[].name' 2>/dev/null | grep -q '^AssetRipper_linux_x64'; then
            ok "AssetRipper (Linux x64) disponivel no GitHub oficial"
          else
            erro "AssetRipper para Linux x64 nao encontrado (nem na sua release, nem no GitHub oficial)"
          fi

          # 3) servidores da Unity
          if curl -fsSI --max-time 30 https://hub.unity3d.com/linux/keys/public >/dev/null 2>&1; then
            ok "chave do Unity Hub acessivel"
          else
            erro "Nao consegui acessar hub.unity3d.com (necessario para instalar o Unity Hub)"
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://services.api.unity.com/ || true)
          if [ "$CODE" != "000" ] && [ -n "$CODE" ]; then
            ok "api da Unity acessivel (HTTP $CODE)"
          else
            erro "Nao consegui acessar services.api.unity.com (necessario para achar a versao da Unity)"
          fi

          # 4) espaco em disco (jogo + projeto exportado + Unity com Android)
          LIVRE=$(df --output=avail -BG / | tail -n 1 | tr -dc '0-9')
          if [ "${LIVRE:-0}" -ge 30 ]; then
            ok "espaco livre: ${LIVRE} GB"
          else
            erro "Pouco espaco livre (${LIVRE:-0} GB); sao necessarios pelo menos 30 GB"
          fi

          # 5) ferramentas basicas
          for c in curl unzip zip perl gh; do
            command -v "$c" >/dev/null 2>&1 || erro "Ferramenta ausente no runner: $c"
          done

          if [ "$ERROS" -gt 0 ]; then
            echo "A verificacao previa encontrou $ERROS problema(s). Cancelando antes de gastar tempo."
            exit 1
          fi
          echo "Verificacao previa concluida sem problemas."

      - name: Instalar Unity Hub 3.22.6 (versao antiga, caminho /opt)
        timeout-minutes: 20
        run: |
          wget -qO - https://hub.unity3d.com/linux/keys/public | gpg --dearmor | sudo tee /usr/share/keyrings/Unity_Technologies_ApS.gpg >/dev/null
          sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/Unity_Technologies_ApS.gpg] https://hub.unity3d.com/linux/repos/deb stable main" > /etc/apt/sources.list.d/unityhub.list'
          printf 'Package: unityhub\nPin: version 3.22.6\nPin-Priority: 1001\n' | sudo tee /etc/apt/preferences.d/unityhub >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unityhub=3.22.6 ffmpeg xvfb
          sudo sed -i 's/^\(.*DISPLAY=:.*XAUTHORITY=.*\)\( "\$@" \)2>&1$/\1\2/' /usr/bin/xvfb-run
          if [ ! -x /opt/unityhub/unityhub ] && [ -x /usr/lib/unityhub/unityhub ]; then
            sudo ln -s /usr/lib/unityhub /opt/unityhub
          fi
          printf '#!/bin/bash\nxvfb-run --auto-servernum /opt/unityhub/unityhub "$@" 2>/dev/null' | sudo tee /usr/bin/unity-hub >/dev/null
          sudo chmod 777 /usr/bin/unity-hub
          ls -la /opt/unityhub/unityhub

      - name: Baixar o jogo da release
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ARQ: ${{ inputs.arquivo }}
        run: |
          set -e
          if ! command -v unrar >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends unrar || true
          fi
          if ! command -v unrar >/dev/null 2>&1; then
            echo "unrar indisponivel; usando 7-Zip oficial"
            wget -q https://www.7-zip.org/a/7z2301-linux-x64.tar.xz -O /tmp/7z.tar.xz
            mkdir -p /tmp/7z && tar -xJf /tmp/7z.tar.xz -C /tmp/7z
            sudo install -m755 /tmp/7z/7zz /usr/local/bin/7zz
          fi
          mkdir -p work/jogo
          echo "Releases deste repositorio:"
          gh release list -R "$GITHUB_REPOSITORY" --limit 20 || true
          ASSETS=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' || true)
          echo "Arquivos na release '$TAG':"
          echo "${ASSETS:-(nenhum)}"
          ZIP="$ARQ"
          if ! echo "$ASSETS" | grep -qxF "$ZIP"; then
            ZIP=$(echo "$ASSETS" | grep -iE '\.(zip|rar)$' | head -n 1 || true)
          fi
          test -n "$ZIP" || { echo "A release '$TAG' nao tem nenhum .zip ou .rar. Anexe o arquivo do jogo nela (e publique, nao deixe como rascunho) e rode de novo."; exit 1; }
          echo "Usando: $ZIP"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$ZIP" -D work
          case "$ZIP" in
            *.rar|*.RAR)
              if command -v unrar >/dev/null 2>&1; then
                unrar x -idq -y "work/$ZIP" work/jogo/
              else
                7zz x -y -owork/jogo "work/$ZIP" >/dev/null
              fi ;;
            *) unzip -q "work/$ZIP" -d work/jogo ;;
          esac
          rm "work/$ZIP"
          DATA=$(find work/jogo -maxdepth 3 -type d -name "*_Data" | head -1)
          test -n "$DATA" || { echo "Pasta *_Data nao encontrada: isso nao parece um build Unity"; exit 1; }
          GAME_DIR=$(dirname "$DATA")
          echo "GAME_DIR=$(realpath "$GAME_DIR")" >> "$GITHUB_ENV"
          echo "Jogo em: $GAME_DIR"
          ls "$GAME_DIR"

      - name: Obter o AssetRipper (da release do jogo ou do site oficial)
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          mkdir -p ripper
          # 1) se voce anexou o AssetRipper na release do jogo, usa ele
          RIP=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -i '^AssetRipper' | head -n 1 || true)
          if [ -n "$RIP" ]; then
            echo "Usando o AssetRipper da sua release: $RIP"
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$RIP" -D ripper
          else
            echo "AssetRipper nao esta na sua release; baixando do site oficial"
            gh release download -R AssetRipper/AssetRipper -p "AssetRipper_linux_x64*" -D ripper
          fi
          F=$(find ripper -maxdepth 1 -type f | head -n 1)
          echo "Arquivo: $F"
          case "$F" in
            *.tar.xz|*_tar.xz) tar -xJf "$F" -C ripper ;;
            *.zip) unzip -q "$F" -d ripper ;;
            *) echo "Formato nao reconhecido: $F"; exit 1 ;;
          esac
          BIN=$(find ripper -type f -name "AssetRipper.GUI.Free" | head -1)
          test -n "$BIN" || { echo "Executavel do AssetRipper nao encontrado:"; find ripper -maxdepth 2; exit 1; }
          chmod +x "$BIN"
          echo "RIPPER_BIN=$(realpath "$BIN")" >> "$GITHUB_ENV"
          ls -la "$(dirname "$BIN")"

      - name: Iniciar o AssetRipper (sem janela)
        timeout-minutes: 5
        run: |
          nohup "$RIPPER_BIN" --headless --port 8080 > ripper.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs -o /dev/null http://127.0.0.1:8080/; then echo "AssetRipper no ar"; exit 0; fi
            sleep 2
          done
          echo "AssetRipper nao subiu. Log:"; cat ripper.log; exit 1

      - name: Carregar e exportar o projeto Unity
        timeout-minutes: 100
        run: |
          set -e
          mkdir -p work/saida
          echo "Carregando $GAME_DIR"
          curl -fsS --max-time 1800 -X POST http://127.0.0.1:8080/LoadFolder --data-urlencode "path=$GAME_DIR" -o /dev/null
          echo "Exportando (pode levar varios minutos)..."
          curl -fsS --max-time 5400 -X POST http://127.0.0.1:8080/Export/UnityProject --data-urlencode "path=$(realpath work/saida)" -o /dev/null
          # garante a estrutura saida/ExportedProject
          if [ ! -d work/saida/ExportedProject ]; then
            PS=$(find work/saida -type f -path "*ProjectSettings/ProjectVersion.txt" | head -1)
            test -n "$PS" || { echo "Exportacao vazia. Log do AssetRipper:"; tail -60 ripper.log; exit 1; }
            PROJ=$(dirname "$(dirname "$PS")")
            mv "$PROJ" work/ExportedProject
            rm -rf work/saida && mkdir -p work/saida && mv work/ExportedProject work/saida/ExportedProject
          fi
          echo "--- ProjectVersion.txt:"
          cat work/saida/ExportedProject/ProjectSettings/ProjectVersion.txt || true
          echo "--- Resumo:"
          du -sh work/saida
          echo "Scripts .cs: $(find work/saida -name '*.cs' | wc -l)"
          echo "Cenas: $(find work/saida -name '*.unity' | wc -l)"

      - name: Parar o AssetRipper e liberar espaco
        timeout-minutes: 5
        if: always()
        run: |
          pkill -f AssetRipper || true
          rm -rf work/jogo ripper
          df -h /

      - name: Compactar o projeto exportado (YanLite V1.zip)
        timeout-minutes: 20
        run: |
          cd work
          zip -qr -1 "$GITHUB_WORKSPACE/$ZIP_NAME" saida
          ls -lh "$GITHUB_WORKSPACE/$ZIP_NAME"

      - name: Disponibilizar o YanLite V1.zip para download
        timeout-minutes: 20
        uses: actions/upload-artifact@v4
        with:
          name: YanLite-V1
          path: ${{ env.ZIP_NAME }}
          compression-level: 0
          retention-days: 14

      - name: Arrumar o projeto para o build
        timeout-minutes: 10
        run: |
          set -e
          PROJECT="work/saida/ExportedProject"
          test -d "$PROJECT/Assets" || { echo "Pasta Assets nao encontrada no projeto exportado"; exit 1; }
          mv "$PROJECT" "$GITHUB_WORKSPACE/project"
          rm -rf work "$GITHUB_WORKSPACE/$ZIP_NAME"
          rm -rf project/Library project/obj project/.vs
          cat project/ProjectSettings/ProjectVersion.txt
          # remove o cursor padrao do ProjectSettings (textura invalida derruba o Unity no build)
          grep -nE '^\s*(defaultCursor|cursorHotspot):' project/ProjectSettings/ProjectSettings.asset || true
          sed -i -E 's/^(\s*defaultCursor:).*/\1 {fileID: 0}/; s/^(\s*cursorHotspot:).*/\1 {x: 0, y: 0}/' project/ProjectSettings/ProjectSettings.asset
          mkdir -p project/Assets/Resources
          echo "Scripts C#: $(find project/Assets -type f -name '*.cs' | wc -l)"
          echo "Shaders: $(find project/Assets -type f \( -iname '*.shader' -o -iname '*.compute' \) | wc -l)"
          ls project
          df -h /

      - name: Criar script de build do Editor (compativel com qualquer versao da Unity)
        timeout-minutes: 5
        run: |
          mkdir -p project/Assets/Editor
          cat > project/Assets/Editor/CIBuild.cs <<'EOF'
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using UnityEditor;
          using UnityEngine;

          // Build do APK que funciona em qualquer versao da Unity (2017 ate a Unity 6 e mais novas).
          // O que muda entre versoes e resolvido com #if ou reflexao, para nunca quebrar a compilacao.
          public static class CIBuild
          {
              static string Env(string n)
              {
                  string v = System.Environment.GetEnvironmentVariable(n);
                  return string.IsNullOrEmpty(v) ? null : v;
              }

              static System.Type FindType(string full)
              {
                  foreach (Assembly a in System.AppDomain.CurrentDomain.GetAssemblies())
                  {
                      try
                      {
                          System.Type t = a.GetType(full, false);
                          if (t != null) return t;
                      }
                      catch (System.Exception) { }
                  }
                  return null;
              }

              static object EnumVal(string typeName, string value)
              {
                  try
                  {
                      System.Type t = FindType(typeName);
                      if (t == null || !t.IsEnum) return null;
                      return System.Enum.Parse(t, value);
                  }
                  catch (System.Exception) { return null; }
              }

              // NamedBuildTarget.Android (Unity 2021.2+); null nas versoes antigas
              static object NamedAndroid()
              {
                  try
                  {
                      System.Type t = FindType("UnityEditor.Build.NamedBuildTarget");
                      if (t != null)
                      {
                          FieldInfo f = t.GetField("Android", BindingFlags.Public | BindingFlags.Static);
                          if (f != null) return f.GetValue(null);
                          PropertyInfo p = t.GetProperty("Android", BindingFlags.Public | BindingFlags.Static);
                          if (p != null) return p.GetValue(null, null);
                      }
                  }
                  catch (System.Exception) { }
                  return null;
              }

              // Chama um metodo estatico pelo nome, so se ele existir nesta versao da Unity
              static bool Call(System.Type t, string name, object[] args)
              {
                  try
                  {
                      foreach (MethodInfo m in t.GetMethods(BindingFlags.Public | BindingFlags.Static))
                      {
                          if (m.Name != name) continue;
                          ParameterInfo[] ps = m.GetParameters();
                          if (ps.Length != args.Length) continue;
                          object[] conv = new object[args.Length];
                          bool ok = true;
                          for (int i = 0; i < ps.Length; i++)
                          {
                              object a = args[i];
                              System.Type pt = ps[i].ParameterType;
                              if (a == null) { conv[i] = null; continue; }
                              if (pt.IsAssignableFrom(a.GetType())) conv[i] = a;
                              else if (pt.IsEnum && a is int) conv[i] = System.Enum.ToObject(pt, (int)a);
                              else { ok = false; break; }
                          }
                          if (!ok) continue;
                          m.Invoke(null, conv);
                          return true;
                      }
                  }
                  catch (System.Exception e) { Debug.LogWarning("CIBuild: " + t.Name + "." + name + " falhou: " + e.Message); }
                  return false;
              }

              // Metodos de PlayerSettings que recebem o alvo Android: NamedBuildTarget (novas) ou BuildTargetGroup (antigas)
              static bool CallAndroid(string name, params object[] rest)
              {
                  object named = NamedAndroid();
                  if (named != null)
                  {
                      object[] a = new object[rest.Length + 1];
                      a[0] = named;
                      rest.CopyTo(a, 1);
                      if (Call(typeof(PlayerSettings), name, a)) return true;
                  }
                  object[] b = new object[rest.Length + 1];
                  b[0] = BuildTargetGroup.Android;
                  rest.CopyTo(b, 1);
                  if (Call(typeof(PlayerSettings), name, b)) return true;
                  Debug.LogWarning("CIBuild: PlayerSettings." + name + " nao existe nesta versao da Unity (ignorado)");
                  return false;
              }

              // Propriedade estatica pelo nome, so se existir nesta versao
              static bool Prop(System.Type t, string name, object value)
              {
                  try
                  {
                      PropertyInfo p = t.GetProperty(name, BindingFlags.Public | BindingFlags.Static);
                      if (p == null || !p.CanWrite) return false;
                      object v = value;
                      if (p.PropertyType.IsEnum && value is int) v = System.Enum.ToObject(p.PropertyType, (int)value);
                      p.SetValue(null, v, null);
                      return true;
                  }
                  catch (System.Exception e) { Debug.LogWarning("CIBuild: " + t.Name + "." + name + " falhou: " + e.Message); return false; }
              }

              static void SetQ(SerializedProperty q, string n, float v)
              {
                  SerializedProperty p = q.FindPropertyRelative(n);
                  if (p == null) return;
                  if (p.propertyType == SerializedPropertyType.Boolean) p.boolValue = v != 0f;
                  else if (p.propertyType == SerializedPropertyType.Float) p.floatValue = v;
                  else if (p.propertyType == SerializedPropertyType.Integer || p.propertyType == SerializedPropertyType.Enum) p.intValue = (int)v;
              }

              // Unity 2019.2 e anteriores nao trazem SDK/NDK/JDK: o workflow instala e passa os caminhos por variavel de ambiente
              static void UseExternalAndroidTools()
              {
                  try
                  {
                      string sdk = Env("UNITY_ANDROID_SDK");
                      string ndk = Env("UNITY_ANDROID_NDK");
                      string jdk = Env("UNITY_ANDROID_JDK");
                      if (sdk != null) EditorPrefs.SetString("AndroidSdkRoot", sdk);
                      if (ndk != null)
                      {
                          EditorPrefs.SetString("AndroidNdkRoot", ndk);
                          EditorPrefs.SetString("AndroidNdkRootR16b", ndk);
                          EditorPrefs.SetString("AndroidNdkRootR19", ndk);
                      }
                      if (jdk != null) EditorPrefs.SetString("JdkPath", jdk);
                      if (sdk != null || ndk != null || jdk != null)
                          Debug.Log("Android externo -> SDK: " + sdk + " | NDK: " + ndk + " | JDK: " + jdk);
                  }
                  catch (System.Exception e) { Debug.LogWarning("Android externo nao configurado: " + e.Message); }
              }

              public static void Build()
              {
                  string appId = System.Environment.GetEnvironmentVariable("APP_ID");
                  string workspace = System.Environment.GetEnvironmentVariable("GITHUB_WORKSPACE");
                  string appName = System.Environment.GetEnvironmentVariable("APP_NAME");
                  if (string.IsNullOrEmpty(appName)) appName = "YanLite Simulator 2017";
                  string apkName = System.Environment.GetEnvironmentVariable("APK_NAME");
                  if (string.IsNullOrEmpty(apkName)) apkName = "YanLite Simulator 2017.apk";

                  // Log mais curto: sem rastro de pilha em cada mensagem
                  foreach (LogType lt in System.Enum.GetValues(typeof(LogType))) Application.SetStackTraceLogType(lt, StackTraceLogType.None);
                  Debug.Log("Compilando com a Unity " + Application.unityVersion);

                  UseExternalAndroidTools();

                  // Nome que aparece no celular depois de instalado
                  PlayerSettings.productName = appName;
                  PlayerSettings.companyName = "HonokoDev";

                  // Cursor padrao invalido derruba o Unity (sinal 11) no fim do build
                  PlayerSettings.defaultCursor = null;
                  PlayerSettings.cursorHotspot = Vector2.zero;

                  if (!CallAndroid("SetApplicationIdentifier", appId)) Prop(typeof(PlayerSettings), "bundleIdentifier", appId);
                  PlayerSettings.bundleVersion = "0.1";
                  PlayerSettings.Android.bundleVersionCode = 1;

                  // API minima: a Unity 2023+/6 nao aceita mais 22
          #if UNITY_2023_1_OR_NEWER || UNITY_6000_0_OR_NEWER
                  int minApi = 25;
          #else
                  int minApi = 22;
          #endif
                  PlayerSettings.Android.minSdkVersion = (AndroidSdkVersions)minApi;
          #if UNITY_2017_1_OR_NEWER
                  PlayerSettings.Android.targetSdkVersion = AndroidSdkVersions.AndroidApiLevelAuto;
          #endif

                  CallAndroid("SetScriptingBackend", ScriptingImplementation.IL2CPP);

                  // ARM64 so existe a partir da Unity 2018.1 (celulares novos nem rodam 32 bits)
          #if UNITY_2018_1_OR_NEWER
                  PlayerSettings.Android.targetArchitectures = AndroidArchitecture.ARMv7 | AndroidArchitecture.ARM64;
          #else
                  PlayerSettings.Android.targetDevice = AndroidTargetDevice.ARMv7;
          #endif

                  PlayerSettings.SetUseDefaultGraphicsAPIs(BuildTarget.Android, false);
                  PlayerSettings.SetGraphicsAPIs(BuildTarget.Android, new UnityEngine.Rendering.GraphicsDeviceType[] { UnityEngine.Rendering.GraphicsDeviceType.OpenGLES3 });

                  // Ajustes opcionais: se a versao da Unity nao tiver, so ignora
                  object strip = EnumVal("UnityEditor.ManagedStrippingLevel", "Low");
                  if (strip != null) CallAndroid("SetManagedStrippingLevel", strip);
                  object il2cppRelease = EnumVal("UnityEditor.Il2CppCompilerConfiguration", "Release");
                  if (il2cppRelease != null) CallAndroid("SetIl2CppCompilerConfiguration", il2cppRelease);
                  Prop(typeof(PlayerSettings), "stripEngineCode", true);
                  Prop(typeof(PlayerSettings), "stripUnusedMeshComponents", true);
                  Prop(typeof(PlayerSettings), "use32BitDisplayBuffer", false);
                  Prop(typeof(PlayerSettings), "gpuSkinning", true);
                  Prop(typeof(PlayerSettings), "MTRendering", true);
                  Call(typeof(PlayerSettings), "SetMobileMTRendering", new object[] { BuildTargetGroup.Android, true });
                  Prop(typeof(PlayerSettings.Android), "useCustomKeystore", false);
                  Prop(typeof(EditorUserBuildSettings), "buildAppBundle", false);

                  PlayerSettings.defaultInterfaceOrientation = UIOrientation.AutoRotation;
                  PlayerSettings.allowedAutorotateToPortrait = false;
                  PlayerSettings.allowedAutorotateToPortraitUpsideDown = false;
                  PlayerSettings.allowedAutorotateToLandscapeLeft = true;
                  PlayerSettings.allowedAutorotateToLandscapeRight = true;

                  // Qualidade Low (nivel 0) como padrao no Android
                  try
                  {
                      Object[] qa = AssetDatabase.LoadAllAssetsAtPath("ProjectSettings/QualitySettings.asset");
                      if (qa != null && qa.Length > 0)
                      {
                          SerializedObject qso = new SerializedObject(qa[0]);
                          SerializedProperty pq = qso.FindProperty("m_PerPlatformDefaultQuality");
                          if (pq != null)
                          {
                              for (int qi = 0; qi < pq.arraySize; qi++)
                              {
                                  SerializedProperty sec = pq.GetArrayElementAtIndex(qi).FindPropertyRelative("second");
                                  if (sec != null) sec.intValue = 0;
                              }
                              qso.ApplyModifiedPropertiesWithoutUndo();
                          }
                      }
                  }
                  catch (System.Exception e) { Debug.LogWarning("Qualidade padrao nao ajustada: " + e.Message); }

                  // Deixa TODOS os niveis de qualidade no minimo (o jogo nao tem como "subir" sozinho)
                  try
                  {
                      Object[] qa2 = AssetDatabase.LoadAllAssetsAtPath("ProjectSettings/QualitySettings.asset");
                      if (qa2 != null && qa2.Length > 0)
                      {
                          SerializedObject qso2 = new SerializedObject(qa2[0]);
                          SerializedProperty lv = qso2.FindProperty("m_QualitySettings");
                          if (lv != null)
                          {
                              for (int li = 0; li < lv.arraySize; li++)
                              {
                                  SerializedProperty q = lv.GetArrayElementAtIndex(li);
                                  SetQ(q, "pixelLightCount", 1);
                                  SetQ(q, "shadows", 0);
                                  SetQ(q, "shadowCascades", 1);
                                  SetQ(q, "shadowDistance", 0f);
                                  SetQ(q, "textureQuality", 1);
                                  SetQ(q, "anisotropicTextures", 0);
                                  SetQ(q, "antiAliasing", 0);
                                  SetQ(q, "softParticles", 0);
                                  SetQ(q, "softVegetation", 0);
                                  SetQ(q, "realtimeReflectionProbes", 0);
                                  SetQ(q, "billboardsFaceCameraPosition", 0);
                                  SetQ(q, "vSyncCount", 0);
                                  SetQ(q, "lodBias", 0.6f);
                                  SetQ(q, "maximumLODLevel", 1);
                                  SetQ(q, "particleRaycastBudget", 16);
                              }
                              qso2.ApplyModifiedPropertiesWithoutUndo();
                          }
                      }
                  }
                  catch (System.Exception e) { Debug.LogWarning("Niveis de qualidade nao ajustados: " + e.Message); }

                  string[] scenes = EditorBuildSettings.scenes.Where(s => s.enabled).Select(s => s.path).ToArray();
                  if (scenes.Length == 0)
                  {
                      Debug.LogWarning("Nenhuma cena ativa no Build Settings. Usando todas as cenas de Assets.");
                      scenes = AssetDatabase.FindAssets("t:Scene").Select(g => AssetDatabase.GUIDToAssetPath(g)).Where(p => p.StartsWith("Assets/")).ToArray();
                  }
                  Debug.Log("Cenas no build: " + scenes.Length);

                  string outDir = Path.Combine(workspace, "build");
                  Directory.CreateDirectory(outDir);

                  BuildPlayerOptions options = new BuildPlayerOptions();
                  options.scenes = scenes;
                  options.locationPathName = Path.Combine(outDir, apkName);
                  options.target = BuildTarget.Android;
                  options.options = BuildOptions.CompressWithLz4HC;

                  bool ok;
          #if UNITY_2018_1_OR_NEWER
                  // a partir da 2018.1 o BuildPlayer devolve um BuildReport
                  UnityEditor.Build.Reporting.BuildReport report = BuildPipeline.BuildPlayer(options);
                  ok = report.summary.result == UnityEditor.Build.Reporting.BuildResult.Succeeded;
          #else
                  // 2017.x devolve texto vazio quando da certo
                  string err = BuildPipeline.BuildPlayer(options);
                  ok = string.IsNullOrEmpty(err);
                  if (!ok) Debug.LogError("Build Failed: " + err);
          #endif
                  if (!ok) EditorApplication.Exit(1);
              }
          }
          EOF

      - name: Silenciar avisos do compilador C# (menos linhas no log)
        timeout-minutes: 5
        run: |
          # codigo descompilado gera milhares de avisos inofensivos
          echo "-nowarn:0168,0219,0649,0414,0108,0109,0114,0162,0169,0618,0067,0659,0660,0661,0252,0253,0472,1717,0105,0642" >> project/Assets/csc.rsp
          cat project/Assets/csc.rsp

      - name: Otimizar importacao de texturas e audio (menos memoria e APK menor)
        timeout-minutes: 5
        run: |
          mkdir -p project/Assets/Editor
          cat > project/Assets/Editor/MobileImportOptimizer.cs <<'IMPEOF'
          using UnityEditor;
          using UnityEngine;

          // Roda durante a importacao do projeto (antes do build), sem reimportar duas vezes.
          public class MobileImportOptimizer : AssetPostprocessor
          {
              const int MaxTextureSize = 1024;

              void OnPreprocessTexture()
              {
                  TextureImporter ti = assetImporter as TextureImporter;
                  if (ti == null) return;
                  if (ti.textureType == TextureImporterType.Cursor) return;
                  ti.anisoLevel = 0;
                  ti.crunchedCompression = false;
                  TextureImporterPlatformSettings ps = ti.GetPlatformTextureSettings("Android");
                  ps.overridden = true;
                  ps.maxTextureSize = Mathf.Min(ps.maxTextureSize, MaxTextureSize);
                  ps.format = TextureImporterFormat.Automatic;
                  ps.textureCompression = TextureImporterCompression.Compressed;
                  ps.compressionQuality = 0;   // rapido: compressao lenta parece travamento no CI
                  ps.crunchedCompression = false;
                  ti.SetPlatformTextureSettings(ps);
              }

              void OnPreprocessAudio()
              {
                  AudioImporter ai = assetImporter as AudioImporter;
                  if (ai == null) return;
                  long size = 0;
                  try { size = new System.IO.FileInfo(assetPath).Length; } catch (System.Exception) { }
                  AudioImporterSampleSettings st = ai.defaultSampleSettings;
                  st.compressionFormat = AudioCompressionFormat.Vorbis;
                  st.quality = 0.4f;
                  st.sampleRateSetting = AudioSampleRateSetting.OptimizeSampleRate;
                  // musicas longas tocam por streaming; efeitos curtos ficam comprimidos na memoria
                  st.loadType = size > 1500000 ? AudioClipLoadType.Streaming : AudioClipLoadType.CompressedInMemory;
                  ai.defaultSampleSettings = st;
                  ai.SetOverrideSampleSettings("Android", st);
                  ai.loadInBackground = true;
              }
          }
          IMPEOF

      - name: Criar camada de toque (joystick e botoes)
        timeout-minutes: 5
        run: |
          cat > project/Assets/TouchControls.cs <<'CSEOF'
          using System.Collections;
          using System.Collections.Generic;
          using UnityEngine;

          // Camada de toque: joystick (esquerda), botoes (direita) e olhar arrastando a tela.
          [DefaultExecutionOrder(-10000)]
          public class TouchControls : MonoBehaviour
          {
              public static Vector2 Move;
              public static Vector2 Look;

              static TouchControls instance;
              const bool ShowDebug = false;
              static string lastKey = "-";
              static bool shiftOn; // Shift vira liga/desliga: 1 toque corre, outro toque anda
              static int errCount;
              // teclado virtual: fila de teclas "digitadas" que viram toques de tecla no jogo
              static readonly Queue<KeyCode> tapQueue = new Queue<KeyCode>();
              static KeyCode tapKey = KeyCode.None;
              static int tapUntil;
              static int anyPressedFrame = -1;
              static string typedNow = "";
              static int typedFrame = -1;
              TouchScreenKeyboard kb;
              string kbPrev = "";
              static int updatedFrame;
              static readonly Dictionary<KeyCode, int> pressSeen = new Dictionary<KeyCode, int>();
              static readonly Dictionary<KeyCode, int> releaseSeen = new Dictionary<KeyCode, int>();
              static string lastError = "";
              GUIStyle dbgStyle;
              static readonly Dictionary<KeyCode, bool> down = new Dictionary<KeyCode, bool>();
              static readonly Dictionary<KeyCode, int> pressedFrame = new Dictionary<KeyCode, int>();
              static readonly Dictionary<KeyCode, int> releasedFrame = new Dictionary<KeyCode, int>();

              class Btn
              {
                  public string label;
                  public KeyCode key;
                  public Rect r;
                  public int finger = -1;
                  public bool wasHeld;
                  public float fs = 0.27f;
              }

              readonly List<Btn> btns = new List<Btn>();
              Texture2D circle;
              GUIStyle style;
              Vector2 joyCenter;
              float joyRadius;
              float unit;
              int joyFinger = -1;
              int lookFinger = -1;
              const float LookScale = 0.12f;

              [RuntimeInitializeOnLoadMethod(RuntimeInitializeLoadType.AfterSceneLoad)]
              static void Boot()
              {
                  if (Application.platform != RuntimePlatform.Android || instance != null) return;
                  GameObject go = new GameObject("TouchControls");
                  DontDestroyOnLoad(go);
                  instance = go.AddComponent<TouchControls>();
              }

              public static bool IsDown(KeyCode k) { if (tapKey != KeyCode.None && tapKey == k) return true; bool v; return down.TryGetValue(k, out v) && v; }
              public static bool AnyDown
              {
                  get
                  {
                      if (tapKey != KeyCode.None) return true;
                      foreach (KeyValuePair<KeyCode, bool> kv in down) if (kv.Value) return true;
                      return false;
                  }
              }
              public static bool AnyPressed { get { return anyPressedFrame == Time.frameCount; } }
              // Texto digitado no teclado do celular neste quadro ("\b" = apagar, "\n" = enter)
              public static string Typed { get { return typedFrame == Time.frameCount ? typedNow : ""; } }
              // GetKeyDown/Up virtual. O codigo normal (Update) enxerga o toque no proprio quadro.
              // Ja a fisica (OnTriggerStay, FixedUpdate...) roda ANTES do Update do quadro, entao recebe
              // o toque uma unica vez, no primeiro passo de fisica depois dele.
              static bool Edge(Dictionary<KeyCode, int> frames, Dictionary<KeyCode, int> seenMap, KeyCode k)
              {
                  int f;
                  if (!frames.TryGetValue(k, out f)) return false;
                  int fc = Time.frameCount;
                  if (updatedFrame == fc) return f == fc;
                  if (f >= fc) return false;
                  int seen;
                  if (seenMap.TryGetValue(k, out seen) && seen >= f) return seen == fc;
                  if (fc - f > 10) return false;
                  seenMap[k] = fc;
                  return true;
              }

              public static bool WasPressed(KeyCode k) { return Edge(pressedFrame, pressSeen, k); }
              public static bool WasReleased(KeyCode k) { return Edge(releasedFrame, releaseSeen, k); }

              static void SetKey(KeyCode k, bool on)
              {
                  bool cur;
                  down.TryGetValue(k, out cur);
                  if (on == cur) return;
                  down[k] = on;
                  if (on) { pressedFrame[k] = Time.frameCount; lastKey = k.ToString(); anyPressedFrame = Time.frameCount; }
                  else releasedFrame[k] = Time.frameCount;
              }

              static void OnLog(string cond, string stack, LogType type)
              {
                  if (type != LogType.Exception && type != LogType.Error) return;
                  errCount++;
                  lastError = cond.Length > 140 ? cond.Substring(0, 140) : cond;
              }

              void AddBtn(string label, KeyCode key) { AddBtn(label, key, 0.27f); }

              void AddBtn(string label, KeyCode key, float fs)
              {
                  Btn b = new Btn();
                  b.label = label;
                  b.key = key;
                  b.fs = fs;
                  btns.Add(b);
              }

              // ---- Teclado do celular ----
              void ToggleKeyboard()
              {
                  if (kb != null && kb.active) { kb.active = false; kb = null; return; }
                  TouchScreenKeyboard.hideInput = true;
                  kb = TouchScreenKeyboard.Open("", TouchScreenKeyboardType.Default, false, false, false);
                  kbPrev = "";
              }

              static KeyCode CharToKey(char c)
              {
                  if (c >= 'a' && c <= 'z') return KeyCode.A + (c - 'a');
                  if (c >= 'A' && c <= 'Z') return KeyCode.A + (c - 'A');
                  if (c >= '0' && c <= '9') return KeyCode.Alpha0 + (c - '0');
                  if (c == ' ') return KeyCode.Space;
                  return KeyCode.None;
              }

              // Le o que foi digitado e transforma em teclas do jogo (GetKey/GetKeyDown) e em inputString
              void UpdateKeyboard()
              {
                  string added = "";
                  if (kb != null)
                  {
                      string t = kb.text ?? "";
                      if (t != kbPrev)
                      {
                          if (t.StartsWith(kbPrev)) added = t.Substring(kbPrev.Length);
                          else if (kbPrev.StartsWith(t))
                          {
                              for (int i = 0; i < kbPrev.Length - t.Length; i++) { tapQueue.Enqueue(KeyCode.Backspace); added += "\b"; }
                          }
                          else added = t;
                          kbPrev = t;
                      }
                      for (int i = 0; i < added.Length; i++)
                      {
                          KeyCode k = CharToKey(added[i]);
                          if (k != KeyCode.None) tapQueue.Enqueue(k);
                      }
                      TouchScreenKeyboard.Status st = kb.status;
                      if (st == TouchScreenKeyboard.Status.Done)
                      {
                          tapQueue.Enqueue(KeyCode.Return);
                          added += "\n";
                          kb = null;
                      }
                      else if (st == TouchScreenKeyboard.Status.Canceled || st == TouchScreenKeyboard.Status.LostFocus)
                      {
                          kb = null;
                      }
                      else if (kbPrev.Length > 100) { kb.text = ""; kbPrev = ""; }
                  }
                  typedNow = added;
                  typedFrame = Time.frameCount;
              }

              // Segura cada tecla digitada por 3 quadros, uma de cada vez
              void ProcessTaps()
              {
                  if (tapKey != KeyCode.None && Time.frameCount >= tapUntil)
                  {
                      releasedFrame[tapKey] = Time.frameCount;
                      tapKey = KeyCode.None;
                  }
                  else if (tapKey == KeyCode.None && tapQueue.Count > 0)
                  {
                      tapKey = tapQueue.Dequeue();
                      tapUntil = Time.frameCount + 3;
                      pressedFrame[tapKey] = Time.frameCount;
                      lastKey = tapKey.ToString();
                      anyPressedFrame = Time.frameCount;
                  }
              }

              void Awake()
              {
                  circle = MakeCircle(128);
                  Application.logMessageReceived += OnLog;
                  // Linha de cima (canto superior direito): menu + acoes de tecla segurar/apertar
                  AddBtn("Esc", KeyCode.Escape);       // PauseMenu
                  AddBtn("P", KeyCode.P);              // KillSystem21
                  AddBtn("K", KeyCode.K);              // KillSystem3 / KillSystem18
                  AddBtn("H", KeyCode.H);              // KillSystem13
                  AddBtn("G", KeyCode.G);              // KillSystem11
                  AddBtn("B", KeyCode.B);              // KillSystem10
                  // Grade de baixo (canto inferior direito), linha de cima: Q E R F
                  AddBtn("Q", KeyCode.Q);              // KillSystem9 / KillSystem22
                  AddBtn("E", KeyCode.E);              // portas, itens, NPCs (a mais usada)
                  AddBtn("R", KeyCode.R);              // KillSystem2 / 6 / 7 / 8 / 31
                  AddBtn("F", KeyCode.F);              // KillSystem
                  // linha de baixo: Shift Space X Y
                  AddBtn("Shift", KeyCode.LeftShift);  // Correr (toque liga/desliga)
                  AddBtn("Space", KeyCode.Space);      // KillSystem14 / KillSystem15
                  AddBtn("X", KeyCode.X);              // KillSystem24 / KillSystem26
                  AddBtn("Y", KeyCode.Y);              // KillSystem16 / KillSystem23
                  // Canto superior esquerdo: Ctrl, 1-5, Enter e o botao que abre o teclado do celular
                  AddBtn("Ctrl", KeyCode.LeftControl, 0.2f);
                  AddBtn("1", KeyCode.Alpha1, 0.3f);
                  AddBtn("2", KeyCode.Alpha2, 0.3f);
                  AddBtn("3", KeyCode.Alpha3, 0.3f);
                  AddBtn("4", KeyCode.Alpha4, 0.3f);
                  AddBtn("5", KeyCode.Alpha5, 0.3f);
                  AddBtn("Enter", KeyCode.Return, 0.17f);
                  AddBtn("Kbd", KeyCode.None, 0.2f);   // abre/fecha o teclado do celular
                  Layout();
              }

              void Layout()
              {
                  float w = Screen.width;
                  float h = Screen.height;
                  unit = Mathf.Min(w, h) * 0.15f;
                  float g = unit * 0.1f;
                  float m = unit * 0.3f;
                  joyRadius = unit * 1.1f;
                  joyCenter = new Vector2(m + joyRadius * 1.1f, m + joyRadius * 1.1f);
                  // 6 botoes pequenos no canto superior direito
                  float s = unit * 0.8f;
                  for (int i = 0; i < 6; i++)
                  {
                      float x = w - m - s - (5 - i) * (s + g);
                      float y = h - m - s;
                      btns[i].r = new Rect(x, y, s, s);
                  }
                  // grade 4 colunas x 2 linhas no canto inferior direito
                  for (int i = 6; i < 14; i++)
                  {
                      int k = i - 6;
                      int row = k / 4;
                      int col = k % 4;
                      float x = w - m - unit - (3 - col) * (unit + g);
                      float y = m + (1 - row) * (unit + g);
                      btns[i].r = new Rect(x, y, unit, unit);
                  }
                  // 8 botoes menores no canto superior esquerdo
                  float s2 = unit * 0.62f;
                  float g2 = unit * 0.08f;
                  for (int i = 14; i < btns.Count; i++)
                  {
                      int k = i - 14;
                      btns[i].r = new Rect(m + k * (s2 + g2), h - m - s2, s2, s2);
                  }
              }

              void Begin(Touch t)
              {
                  Vector2 p = t.position;
                  if (joyFinger < 0 && (p - joyCenter).magnitude < joyRadius * 1.7f)
                  {
                      joyFinger = t.fingerId;
                      return;
                  }
                  float pad = unit * 0.1f;
                  for (int i = 0; i < btns.Count; i++)
                  {
                      Rect b = btns[i].r;
                      Rect r = new Rect(b.x - pad, b.y - pad, b.width + pad * 2f, b.height + pad * 2f);
                      if (btns[i].finger < 0 && r.Contains(p))
                      {
                          btns[i].finger = t.fingerId;
                          return;
                      }
                  }
                  if (lookFinger < 0 && p.x > Screen.width * 0.3f) lookFinger = t.fingerId;
              }

              void End(int id)
              {
                  if (joyFinger == id) joyFinger = -1;
                  if (lookFinger == id) lookFinger = -1;
                  for (int i = 0; i < btns.Count; i++)
                      if (btns[i].finger == id) btns[i].finger = -1;
              }

              void Hold(Touch t)
              {
                  if (t.fingerId == joyFinger)
                  {
                      Vector2 v = (t.position - joyCenter) / joyRadius;
                      if (v.magnitude > 1f) v = v.normalized;
                      if (v.magnitude < 0.15f) v = Vector2.zero;
                      Move = v;
                  }
                  else if (t.fingerId == lookFinger)
                  {
                      Look += t.deltaPosition * LookScale;
                  }
              }

              void Update()
              {
                  Layout();
                  Look = Vector2.zero;
                  Touch[] touches = Input.touches;
                  if (touches.Length == 0)
                  {
                      joyFinger = -1;
                      lookFinger = -1;
                      for (int i = 0; i < btns.Count; i++) btns[i].finger = -1;
                  }
                  for (int i = 0; i < touches.Length; i++)
                  {
                      Touch t = touches[i];
                      if (t.phase == TouchPhase.Began) Begin(t);
                      if (t.phase == TouchPhase.Ended || t.phase == TouchPhase.Canceled) End(t.fingerId);
                      else Hold(t);
                  }
                  if (joyFinger < 0) Move = Vector2.zero;
                  SetKey(KeyCode.W, Move.y > 0.5f);
                  SetKey(KeyCode.S, Move.y < -0.5f);
                  SetKey(KeyCode.A, Move.x < -0.5f);
                  SetKey(KeyCode.D, Move.x > 0.5f);
                  for (int i = 0; i < btns.Count; i++)
                  {
                      Btn b = btns[i];
                      bool held = b.finger >= 0;
                      if (b.key == KeyCode.None)
                      {
                          if (held && !b.wasHeld) ToggleKeyboard();
                          b.wasHeld = held;
                          continue;
                      }
                      if (b.key == KeyCode.LeftShift)
                      {
                          if (held && !b.wasHeld) shiftOn = !shiftOn;
                          SetKey(b.key, shiftOn);
                      }
                      else SetKey(b.key, held);
                      b.wasHeld = held;
                  }
                  UpdateKeyboard();
                  ProcessTaps();
                  updatedFrame = Time.frameCount;
              }

              void OnGUI()
              {
                  if (style == null)
                  {
                      style = new GUIStyle(GUI.skin.label);
                      style.alignment = TextAnchor.MiddleCenter;
                      style.normal.textColor = Color.white;
                  }
                  if (Event.current.type != EventType.Repaint) return;
                  float h = Screen.height;
                  style.fontSize = Mathf.RoundToInt(unit * 0.27f);
                  GUI.color = new Color(1f, 1f, 1f, 0.45f);
                  GUI.DrawTexture(new Rect(joyCenter.x - joyRadius, h - joyCenter.y - joyRadius, joyRadius * 2f, joyRadius * 2f), circle);
                  Vector2 k = joyCenter + Move * joyRadius * 0.6f;
                  float kr = joyRadius * 0.42f;
                  GUI.color = new Color(1f, 1f, 1f, 0.8f);
                  GUI.DrawTexture(new Rect(k.x - kr, h - k.y - kr, kr * 2f, kr * 2f), circle);
                  for (int i = 0; i < btns.Count; i++)
                  {
                      Btn b = btns[i];
                      Rect gr = new Rect(b.r.x, h - b.r.yMax, b.r.width, b.r.height);
                      GUI.color = new Color(1f, 1f, 1f, (b.finger >= 0 || (b.key == KeyCode.LeftShift && shiftOn) || (b.key == KeyCode.None && kb != null)) ? 0.95f : 0.5f);
                      GUI.DrawTexture(gr, circle);
                      GUI.color = Color.white;
                      style.fontSize = Mathf.RoundToInt(unit * b.fs);
                      GUI.Label(gr, b.label, style);
                  }
                  GUI.color = Color.white;
                  if (ShowDebug)
                  {
                      if (dbgStyle == null)
                      {
                          dbgStyle = new GUIStyle(GUI.skin.label);
                          dbgStyle.alignment = TextAnchor.UpperLeft;
                          dbgStyle.wordWrap = true;
                          dbgStyle.normal.textColor = Color.yellow;
                      }
                      dbgStyle.fontSize = Mathf.RoundToInt(unit * 0.2f);
                      GUI.Label(new Rect(Screen.width * 0.18f, 4f, Screen.width * 0.64f, unit * 1.2f), "tecla: " + lastKey + " | erros: " + errCount + "\n" + lastError, dbgStyle);
                  }
              }

              static Texture2D MakeCircle(int s)
              {
                  Texture2D t = new Texture2D(s, s, TextureFormat.RGBA32, false);
                  float c = (s - 1) * 0.5f;
                  float r = s * 0.5f;
                  Color[] px = new Color[s * s];
                  for (int y = 0; y < s; y++)
                  {
                      for (int x = 0; x < s; x++)
                      {
                          float d = Mathf.Sqrt((x - c) * (x - c) + (y - c) * (y - c)) / r;
                          float edge = Mathf.Clamp01((1f - d) * r);
                          float a = (d > 0.93f ? 1f : 0.35f) * edge;
                          px[y * s + x] = new Color(1f, 1f, 1f, a);
                      }
                  }
                  t.SetPixels(px);
                  t.Apply();
                  t.filterMode = FilterMode.Bilinear;
                  return t;
              }
          }

          // Substitui Input.GetKey*/GetAxis* pelas versoes que tambem aceitam o toque.
          public static class TInput
          {
              public static bool GetKey(KeyCode k) { return Input.GetKey(k) || TouchControls.IsDown(k); }
              public static bool GetKeyDown(KeyCode k) { return Input.GetKeyDown(k) || TouchControls.WasPressed(k); }
              public static bool GetKeyUp(KeyCode k) { return Input.GetKeyUp(k) || TouchControls.WasReleased(k); }
              public static bool GetKey(string n) { try { return Input.GetKey(n); } catch (System.Exception) { return false; } }
              public static bool GetKeyDown(string n) { try { return Input.GetKeyDown(n); } catch (System.Exception) { return false; } }
              public static bool GetKeyUp(string n) { try { return Input.GetKeyUp(n); } catch (System.Exception) { return false; } }
              public static float GetAxis(string n) { return Axis(n, false); }
              public static float GetAxisRaw(string n) { return Axis(n, true); }

              // Teclado virtual: texto digitado no celular e "qualquer tecla"
              public static string inputString { get { return Input.inputString + TouchControls.Typed; } }
              public static bool anyKeyDown { get { return Input.anyKeyDown || TouchControls.AnyPressed; } }
              public static bool anyKey { get { return Input.anyKey || TouchControls.AnyDown; } }

              // Usado nos scripts de camera: olhar pelo toque, sem joystick/teclas virtuais.
              public static float CamAxis(string n)
              {
                  if (n == "Mouse X" || n == "Mouse Y") return Axis(n, false);
                  try { return Input.GetAxis(n); } catch (System.Exception) { return 0f; }
              }

              static float Axis(string n, bool raw)
              {
                  float v = 0f;
                  try { v = raw ? Input.GetAxisRaw(n) : Input.GetAxis(n); }
                  catch (System.Exception) { v = 0f; }
                  if (n == "Horizontal") return Mathf.Clamp(v + TouchControls.Move.x, -1f, 1f);
                  if (n == "Vertical") return Mathf.Clamp(v + TouchControls.Move.y, -1f, 1f);
                  // No Android o Unity transforma QUALQUER dedo em "mouse" (inclusive o do joystick).
                  // Por isso o mouse e ignorado aqui: a camera so olha pelo dedo de olhar.
                  if (n == "Mouse X") return Application.platform == RuntimePlatform.Android ? TouchControls.Look.x : v;
                  if (n == "Mouse Y") return Application.platform == RuntimePlatform.Android ? TouchControls.Look.y : v;
                  return v;
              }
          }

          // FindObjectsOfType foi substituido por FindObjectsByType na Unity 2023+/6
          public static class FindCompat
          {
              public static T[] All<T>() where T : Object
              {
          #if UNITY_2023_1_OR_NEWER || UNITY_6000_0_OR_NEWER
                  return Object.FindObjectsByType<T>(FindObjectsSortMode.None);
          #else
                  return Object.FindObjectsOfType<T>();
          #endif
              }
          }

          // Ajustes de desempenho e correcoes para celulares de entrada (ex.: Moto G24).
          // Mexa nos valores abaixo pra equilibrar qualidade x desempenho.
          public static class MobileTune
          {
              const int Fps = 30;              // limite de quadros por segundo (30 = bem mais leve e fresco; se quiser mais fluido, use 60)
              const float RenderScale = 0.5f;  // 1 = resolucao nativa; menor = mais leve (0.5 = metade; se achar borrado, suba pra 0.6)
              const int TextureLimit = 1;      // 0 = texturas cheias, 1 = metade (usa menos memoria)
              // sombras: sempre desligadas (sao as mais pesadas)

              static bool resized;
              static bool timeTuned;

              [RuntimeInitializeOnLoadMethod(RuntimeInitializeLoadType.BeforeSceneLoad)]
              static void Boot()
              {
                  if (Application.platform != RuntimePlatform.Android) return;
                  UnityEngine.SceneManagement.SceneManager.sceneLoaded += OnLoaded;
                  Apply();
              }

              [RuntimeInitializeOnLoadMethod(RuntimeInitializeLoadType.AfterSceneLoad)]
              static void BootFixer()
              {
                  if (Application.platform != RuntimePlatform.Android) return;
                  GameObject go = new GameObject("MobileFixer");
                  Object.DontDestroyOnLoad(go);
                  go.AddComponent<MobileFixer>();
              }

              static void OnLoaded(UnityEngine.SceneManagement.Scene s, UnityEngine.SceneManagement.LoadSceneMode m)
              {
                  Resources.UnloadUnusedAssets();
                  Apply();
                  MobileFixer.RequestFull();
              }

              public static void Apply()
              {
                  // Qualidade sempre no nivel mais baixo (Low), mesmo se o jogo tentar mudar
                  if (QualitySettings.GetQualityLevel() != 0) QualitySettings.SetQualityLevel(0, true);
                  Screen.sleepTimeout = SleepTimeout.NeverSleep;
                  QualitySettings.vSyncCount = 0;
                  QualitySettings.antiAliasing = 0;
                  QualitySettings.anisotropicFiltering = AnisotropicFiltering.Disable;
                  QualitySettings.pixelLightCount = 1;
                  QualitySettings.softParticles = false;
                  QualitySettings.realtimeReflectionProbes = false;
                  QualitySettings.skinWeights = SkinWeights.TwoBones;
                  QualitySettings.lodBias = 0.6f;
                  QualitySettings.shadowDistance = 0f;
                  QualitySettings.shadowCascades = 0;
                  QualitySettings.billboardsFaceCameraPosition = false;
                  QualitySettings.particleRaycastBudget = 16;
                  QualitySettings.asyncUploadTimeSlice = 4;
                  QualitySettings.asyncUploadBufferSize = 16;
                  QualitySettings.shadows = ShadowQuality.Disable;
          #if UNITY_2022_2_OR_NEWER
                  QualitySettings.globalTextureMipmapLimit = TextureLimit;
          #else
                  QualitySettings.masterTextureLimit = TextureLimit;
          #endif
                  Application.targetFrameRate = Fps;
                  QualitySettings.maximumLODLevel = 1;
                  Application.backgroundLoadingPriority = ThreadPriority.Low;
                  if (!timeTuned)
                  {
                      timeTuned = true;
                      Time.fixedDeltaTime = 1f / 30f;   // fisica no mesmo ritmo do jogo (30 fps)
                      Time.maximumDeltaTime = 0.1f;
                  }
                  if (!resized && Screen.height > 540)
                  {
                      resized = true;
                      int h = Mathf.RoundToInt(Screen.height * RenderScale);
                      int w = Mathf.RoundToInt(Screen.width * RenderScale);
                      Screen.SetResolution(w, h, true);
                  }
              }
          }

          // Corrige dois problemas do port:
          // 1) O shader das particulas usa GPU instancing (SSBO no vertex shader), que o Mali nao suporta
          //    (erro "vertex shader storage blocks (1) is greater than the maximum (0)"). Desligamos.
          // 2) Todos os shaders do jogo sao trocados por um toon simples e leve (contorno fino so nos personagens).
          public class MobileFixer : MonoBehaviour
          {
                        // Efeitos de camera (SSAO, Bloom, MotionBlur, AntiAliasing): pesados no celular e podem
              // deixar a cena Dream toda branca. false = desligados.
              const bool KeepImageEffects = false;
              static bool full = true;
              static float whiteSince = -1f;

              public static void RequestFull() { full = true; }

              IEnumerator Start()
              {
                  WaitForSeconds w = new WaitForSeconds(1.5f);
                  int n = 0;
                  while (true)
                  {
                      yield return w;
                      n++;
                      if (full) { full = false; FixMaterials(); FixRenderers(); }
                      if (n % 3 == 0) { MobileTune.Apply(); FixParticles(); FixCameras(); FixLights(); }
                      if (n % 8 == 0) FixRenderers();
                      WatchDream();
                  }
              }

              // Tira o que o toon simples nao usa: sombras, sondas de luz/reflexo, animacao fora da tela
              // e particulas em excesso.
              static void FixRenderers()
              {
                  try
                  {
                      Renderer[] rs = FindCompat.All<Renderer>();
                      for (int i = 0; i < rs.Length; i++)
                      {
                          Renderer r = rs[i];
                          if (r == null) continue;
                          r.shadowCastingMode = UnityEngine.Rendering.ShadowCastingMode.Off;
                          r.receiveShadows = false;
                          r.reflectionProbeUsage = UnityEngine.Rendering.ReflectionProbeUsage.Off;
                          r.lightProbeUsage = UnityEngine.Rendering.LightProbeUsage.Off;
                          SkinnedMeshRenderer smr = r as SkinnedMeshRenderer;
                          if (smr != null) smr.updateWhenOffscreen = false;
                      }
                      Animator[] an = FindCompat.All<Animator>();
                      for (int i = 0; i < an.Length; i++)
                          if (an[i] != null && an[i].cullingMode == AnimatorCullingMode.AlwaysAnimate)
                              an[i].cullingMode = AnimatorCullingMode.CullUpdateTransforms;
                      ParticleSystem[] pss = FindCompat.All<ParticleSystem>();
                      for (int i = 0; i < pss.Length; i++)
                      {
                          if (pss[i] == null) continue;
                          var main = pss[i].main;
                          if (main.maxParticles > 150) main.maxParticles = 150;
                      }
                  }
                  catch (System.Exception) { }
              }

              static void FixParticles()
              {
                  try
                  {
                      ParticleSystemRenderer[] ps = Resources.FindObjectsOfTypeAll<ParticleSystemRenderer>();
                      for (int i = 0; i < ps.Length; i++)
                          if (ps[i] != null && ps[i].enableGPUInstancing) ps[i].enableGPUInstancing = false;
                  }
                  catch (System.Exception) { }
              }

              // Desliga sombras de todas as luzes
              static void FixLights()
              {
                  try
                  {
                      Light[] ls = FindCompat.All<Light>();
                      for (int i = 0; i < ls.Length; i++)
                          if (ls[i] != null && ls[i].shadows != LightShadows.None) ls[i].shadows = LightShadows.None;
                  }
                  catch (System.Exception) { }
              }

              static void FixCameras()
              {
                  try
                  {
                      Camera[] cb = Camera.allCameras;
                      for (int i = 0; i < cb.Length; i++)
                      {
                          cb[i].allowHDR = false;
                          cb[i].allowMSAA = false;
                          if (cb[i].farClipPlane > 150f) cb[i].farClipPlane = 150f;
                      }
                  }
                  catch (System.Exception) { }
                  if (KeepImageEffects) return;
                  try
                  {
                      Camera[] cams = Camera.allCameras;
                      for (int i = 0; i < cams.Length; i++)
                      {
                          MonoBehaviour[] mbs = cams[i].GetComponents<MonoBehaviour>();
                          for (int j = 0; j < mbs.Length; j++)
                          {
                              if (mbs[j] == null || !mbs[j].enabled) continue;
                              string t = mbs[j].GetType().Name;
                              if (t.Contains("Bloom") || t.Contains("Blur") || t.Contains("SSAO") || t.Contains("AmbientOcc")
                                  || t.Contains("ScreenSpace") || t.Contains("Antialiasing") || t.Contains("AntiAliasing")
                                  || t.Contains("DepthOfField") || t.Contains("Vignette") || t.Contains("SunShafts")
                                  || t.Contains("GlobalFog") || t.Contains("Tonemapping") || t.Contains("ColorCorrection")
                                  || t.Contains("PostProcess") || t.Contains("NoiseAndGrain") || t.Contains("EdgeDetection"))
                                  mbs[j].enabled = false;
                          }
                      }
                  }
                  catch (System.Exception) { }
              }

              // Se a tela da cena Dream ficar toda branca por mais de 8 segundos (imagem "White" do Fade
              // que nao some), esconde essa imagem para o jogo continuar.
              static void WatchDream()
              {
                  try
                  {
                      UnityEngine.SceneManagement.Scene sc = UnityEngine.SceneManagement.SceneManager.GetActiveScene();
                      if (!sc.name.Contains("Dream")) { whiteSince = -1f; return; }
                      UnityEngine.UI.Image[] imgs = Resources.FindObjectsOfTypeAll<UnityEngine.UI.Image>();
                      bool white = false;
                      for (int i = 0; i < imgs.Length; i++)
                      {
                          UnityEngine.UI.Image im = imgs[i];
                          if (im == null || im.name != "White" || !im.gameObject.activeInHierarchy) continue;
                          if (im.color.a * im.canvasRenderer.GetAlpha() < 0.95f) continue;
                          white = true;
                          if (whiteSince < 0f) whiteSince = Time.unscaledTime;
                          else if (Time.unscaledTime - whiteSince > 8f)
                          {
                              Color c = im.color;
                              c.a = 0f;
                              im.color = c;
                              im.canvasRenderer.SetAlpha(0f);
                              whiteSince = -1f;
                          }
                      }
                      if (!white) whiteSince = -1f;
                  }
                  catch (System.Exception) { }
              }

              static Shader toonShader;
              static Shader invisibleShader;
              const float OutlineWidth = 0.002f;        // espessura do contorno fino (0 = sem contorno)
              const bool OutlineSoPersonagens = true;   // true = contorno so em personagens (bem mais leve)

              // Shaders que NAO sao trocados (interface, texto, ceu, particulas)
              static bool Keep(string n)
              {
                  if (n.StartsWith("UI/") || n.StartsWith("Sprites/") || n.StartsWith("GUI/") || n.StartsWith("TextMeshPro")) return true;
                  if (n.StartsWith("Skybox") || n.StartsWith("Particles/") || n.StartsWith("Mobile/Particles") || n.StartsWith("Legacy Shaders/Particles")) return true;
                  if (n.StartsWith("Custom/")) return true;
                  if (n.StartsWith("Hidden/") && n != "Hidden/InternalErrorShader") return true;
                  return false;
              }

              // Troca todos os shaders do jogo por um toon simples e barato (com contorno fino).
              // Materiais "so contorno" ficam invisiveis; folhas viram toon com recorte, dos dois lados.
              static void FixMaterials()
              {
                  try
                  {
                      if (toonShader == null) toonShader = Shader.Find("Custom/NoOutlineToon");
                      if (invisibleShader == null) invisibleShader = Shader.Find("Custom/Invisible");
                      if (toonShader == null) return;

                      HashSet<Material> chars = new HashSet<Material>();
                      SkinnedMeshRenderer[] sk = Resources.FindObjectsOfTypeAll<SkinnedMeshRenderer>();
                      for (int i = 0; i < sk.Length; i++)
                      {
                          if (sk[i] == null) continue;
                          Material[] sm = sk[i].sharedMaterials;
                          for (int j = 0; j < sm.Length; j++) if (sm[j] != null) chars.Add(sm[j]);
                      }

                      Material[] ms = Resources.FindObjectsOfTypeAll<Material>();
                      for (int i = 0; i < ms.Length; i++)
                      {
                          Material m = ms[i];
                          if (m == null || m.shader == null) continue;
                          if (m.shader == toonShader || m.shader == invisibleShader) continue;
                          string n = m.shader.name;
                          if (Keep(n)) continue;
                          string mn = m.name.ToLowerInvariant();
                          bool outline = n.IndexOf("outline", System.StringComparison.OrdinalIgnoreCase) >= 0;
                          bool leaf = mn.Contains("leaves") || mn.Contains("leaf");
                          if (m.HasProperty("_Outline")) m.SetFloat("_Outline", 0f);
                          if (outline && n.IndexOf("only", System.StringComparison.OrdinalIgnoreCase) >= 0)
                          {
                              if (invisibleShader != null) m.shader = invisibleShader;
                              continue;
                          }
                          Texture tex = m.HasProperty("_MainTex") ? m.GetTexture("_MainTex") : null;
                          Color col = m.HasProperty("_Color") ? m.GetColor("_Color") : Color.white;
                          Vector2 sc = m.HasProperty("_MainTex") ? m.GetTextureScale("_MainTex") : Vector2.one;
                          Vector2 of = m.HasProperty("_MainTex") ? m.GetTextureOffset("_MainTex") : Vector2.zero;
                          float cut = m.HasProperty("_Cutoff") ? m.GetFloat("_Cutoff") : 0f;
                          if (leaf && cut < 0.5f) cut = 0.5f;
                          int q = m.renderQueue;
                          m.shader = toonShader;
                          m.SetTexture("_MainTex", tex);
                          m.SetTextureScale("_MainTex", sc);
                          m.SetTextureOffset("_MainTex", of);
                          m.SetColor("_Color", col);
                          m.SetFloat("_Cutoff", cut);
                          bool fade = q >= 3000;
                          m.SetFloat("_SrcBlend", fade ? 5f : 1f);
                          m.SetFloat("_DstBlend", fade ? 10f : 0f);
                          m.SetFloat("_ZWrite", fade ? 0f : 1f);
                          m.SetFloat("_Cull", leaf ? 0f : 2f);
                          bool wantsOutline = !OutlineSoPersonagens || outline || chars.Contains(m);
                          bool thin = !fade && !leaf && cut <= 0.01f && OutlineWidth > 0f && wantsOutline;
                          m.SetFloat("_OutlineWidth", thin ? OutlineWidth : 0f);
                          m.SetColor("_OutlineColor", Color.black);
                          m.renderQueue = q;
                      }
                  }
                  catch (System.Exception) { }
              }
          }
          CSEOF

      - name: Criar shaders toon (contorno fino)
        timeout-minutes: 5
        run: |
          mkdir -p project/Assets/Resources
          cat > project/Assets/Resources/NoOutlineToon.shader <<'SHEOF1'
          Shader "Custom/NoOutlineToon"
          {
              Properties
              {
                  _MainTex ("Texture", 2D) = "white" {}
                  _Color ("Color", Color) = (1,1,1,1)
                  _Cutoff ("Cutoff", Range(0,1)) = 0
                  _SrcBlend ("Src", Float) = 1
                  _DstBlend ("Dst", Float) = 0
                  _ZWrite ("ZWrite", Float) = 1
                  _Cull ("Cull", Float) = 2
                  _OutlineWidth ("Outline Width", Float) = 0
                  _OutlineColor ("Outline Color", Color) = (0,0,0,1)
              }
              SubShader
              {
                  Tags { "RenderType"="Opaque" }
                  Pass
                  {
                      Tags { "LightMode"="ForwardBase" }
                      Blend [_SrcBlend] [_DstBlend]
                      ZWrite [_ZWrite]
                      Cull [_Cull]
                      CGPROGRAM
                      #pragma vertex vert
                      #pragma fragment frag
                      #include "UnityCG.cginc"
                      sampler2D _MainTex;
                      float4 _MainTex_ST;
                      fixed4 _Color;
                      fixed _Cutoff;
                      struct v2f
                      {
                          float4 pos : SV_POSITION;
                          float2 uv : TEXCOORD0;
                          fixed shade : TEXCOORD1;
                      };
                      v2f vert (appdata_base v)
                      {
                          v2f o;
                          o.pos = UnityObjectToClipPos(v.vertex);
                          o.uv = TRANSFORM_TEX(v.texcoord, _MainTex);
                          float3 n = UnityObjectToWorldNormal(v.normal);
                          float3 l = normalize(_WorldSpaceLightPos0.xyz + float3(0, 0.0001, 0));
                          float nl = dot(n, l) * 0.5 + 0.5;
                          o.shade = lerp(0.6, 1.0, smoothstep(0.3, 0.6, nl));
                          return o;
                      }
                      fixed4 frag (v2f i) : SV_Target
                      {
                          fixed4 c = tex2D(_MainTex, i.uv) * _Color;
                          clip(c.a - _Cutoff);
                          c.rgb *= i.shade;
                          return c;
                      }
                      ENDCG
                  }
                  Pass
                  {
                      Cull Front
                      CGPROGRAM
                      #pragma vertex vertO
                      #pragma fragment fragO
                      #include "UnityCG.cginc"
                      float _OutlineWidth;
                      fixed4 _OutlineColor;
                      struct v2fo
                      {
                          float4 pos : SV_POSITION;
                      };
                      v2fo vertO (appdata_base v)
                      {
                          v2fo o;
                          o.pos = UnityObjectToClipPos(v.vertex);
                          if (_OutlineWidth <= 0.0)
                          {
                              o.pos = float4(2.0, 2.0, 2.0, 1.0);
                              return o;
                          }
                          float3 norm = mul((float3x3)UNITY_MATRIX_IT_MV, v.normal);
                          float2 dir = TransformViewToProjection(norm.xy);
                          float dl = length(dir);
                          dir = (dl > 0.00001) ? (dir / dl) : float2(0.0, 0.0);
                          dir.x *= _ScreenParams.y / _ScreenParams.x;
                          o.pos.xy += dir * o.pos.w * _OutlineWidth;
                          return o;
                      }
                      fixed4 fragO (v2fo i) : SV_Target
                      {
                          return _OutlineColor;
                      }
                      ENDCG
                  }
              }
          }
          SHEOF1
          cat > project/Assets/Resources/Invisible.shader <<'SHEOF2'
          Shader "Custom/Invisible"
          {
              SubShader
              {
                  Tags { "Queue"="Geometry" "RenderType"="Opaque" }
                  Pass
                  {
                      ZWrite Off
                      ColorMask 0
                      CGPROGRAM
                      #pragma vertex vert
                      #pragma fragment frag
                      #include "UnityCG.cginc"
                      struct v2f { float4 pos : SV_POSITION; };
                      v2f vert (float4 v : POSITION)
                      {
                          v2f o;
                          o.pos = UnityObjectToClipPos(v);
                          return o;
                      }
                      fixed4 frag (v2f i) : SV_Target { return fixed4(0, 0, 0, 0); }
                      ENDCG
                  }
              }
          }
          SHEOF2

      - name: Trocar leituras de teclado pelas que aceitam toque
        timeout-minutes: 5
        run: |
          cd project/Assets
          [ -d Scripts ] && cd Scripts
          grep -rlZE --exclude-dir=Editor --include=*.cs '(CF2Input|Input)\.(GetKeyDown|GetKeyUp|GetKey|GetAxisRaw|GetAxis)\(' . | xargs -0 -r perl -pi -e 's/(?<![\.\w])(?:UnityEngine\.)?(?:CF2Input|Input)\.(GetKeyDown|GetKeyUp|GetKey|GetAxisRaw|GetAxis)\(/TInput.$1(/g'
          echo "Chamadas trocadas: $(grep -rho --include=*.cs 'TInput\.Get' . | wc -l)"
          echo "Chamadas originais restantes (Input/CF2Input, fora de Editor): $(grep -rhoE --exclude-dir=Editor --include=*.cs '(^|[^.A-Za-z_])(UnityEngine\.)?(CF2Input|Input)\.(GetKeyDown|GetKeyUp|GetKey|GetAxisRaw|GetAxis)\(' . | wc -l)"
          grep -rnE --exclude-dir=Editor --include=*.cs '(^|[^.A-Za-z_])(UnityEngine\.)?(CF2Input|Input)\.(GetKeyDown|GetKeyUp|GetKey|GetAxisRaw|GetAxis)\(' . | head -20 || true
          echo "Scripts que usam mouse direto (posicao/clique): $(grep -rlE --include=*.cs 'Input\.(mousePosition|GetMouseButton)' . | wc -l)"

      - name: Camera principal olha so pelo toque (ignora o joystick)
        timeout-minutes: 5
        run: |
          cd project/Assets
          [ -d Scripts ] && cd Scripts
          find . -iname '*camera*.cs' ! -path '*/Editor/*' -print0 | while IFS= read -r -d '' f; do
            perl -pi -e 's/TInput\.GetAxisRaw\(/TInput.CamAxis(/g; s/TInput\.GetAxis\(/TInput.CamAxis(/g' "$f"
            echo "camera ajustada: $f"
          done
          echo "--- arquivos que leem eixos Horizontal/Vertical/Mouse:"
          grep -rlE --include=*.cs 'TInput\.(GetAxis|GetAxisRaw|CamAxis)\("(Horizontal|Vertical|Mouse X|Mouse Y)"' . | head -30 || true

      - name: Trocar inputString e anyKey pelas versoes com teclado virtual
        timeout-minutes: 5
        run: |
          cd project/Assets
          [ -d Scripts ] && cd Scripts
          grep -rlZE --exclude-dir=Editor --exclude=TouchControls.cs --include=*.cs '(CF2Input|Input)\.(inputString|anyKeyDown|anyKey)\b' . | xargs -0 -r perl -pi -e 's/(?<![\.\w])(?:UnityEngine\.)?(?:CF2Input|Input)\.(inputString|anyKeyDown|anyKey)\b/TInput.$1/g'
          echo "inputString/anyKey trocados: $(grep -rhoE --include=*.cs 'TInput\.(inputString|anyKeyDown|anyKey)\b' . | wc -l)"

      - name: Corrigir pasta de configuracao no Android
        timeout-minutes: 5
        run: |
          cd project/Assets
          [ -d Scripts ] && cd Scripts
          grep -rlZE --exclude-dir=Editor --include=*.cs 'Environment\.GetFolderPath' . | xargs -0 -r perl -pi -e 's/Environment\.GetFolderPath\(Environment\.SpecialFolder\.(MyDocuments|Personal|ApplicationData|LocalApplicationData|DesktopDirectory)\)/Application.persistentDataPath/g'
          echo "persistentDataPath em: $(grep -rl --include=*.cs 'Application.persistentDataPath' . | wc -l) arquivos"

      - name: Descobrir a versao da Unity do projeto exportado
        timeout-minutes: 5
        id: unityver
        env:
          FORCAR: ${{ inputs.unity }}
        run: |
          PV=project/ProjectSettings/ProjectVersion.txt
          V=""; REV=""
          if [ -n "$FORCAR" ]; then
            V=$(echo "$FORCAR" | tr -d '[:space:]')
            echo "Versao forcada por voce: $V"
          elif [ -f "$PV" ]; then
            V=$(grep -m1 '^m_EditorVersion:' "$PV" | sed 's/^m_EditorVersion:[[:space:]]*//' | tr -d '\r ' || true)
            REV=$(grep -m1 '^m_EditorVersionWithRevision:' "$PV" | sed -n 's/.*(\([0-9a-fA-F]\{8,\}\)).*/\1/p' | tr -d '\r' || true)
          fi
          # tira sufixo de build regional (ex.: 2020.3.48f1c1 -> 2020.3.48f1)
          V=$(echo "$V" | sed -E 's/^([0-9.]+[abfp][0-9]+)c[0-9]+$/\1/')
          if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?([abfp][0-9]+)?$'; then
            echo "::warning::Nao consegui ler a versao da Unity (leitura: '$V'). Usando 2021.3.45f1. Para escolher outra, preencha a entrada 'unity' ao rodar o workflow."
            V=2021.3.45f1; REV=""
          fi
          MAJOR=${V%%.*}
          REST=${V#*.}; MINOR=${REST%%.*}; MINOR=${MINOR//[!0-9]/}; MINOR=${MINOR:-0}

          # versao LTS mais proxima, usada so se a versao exata nao puder ser instalada no Linux
          case "$MAJOR" in
            2017) FB=2017.4.40f1 ;;
            2018) FB=2018.4.36f1 ;;
            2019) FB=2019.4.40f1 ;;
            2020) FB=2020.3.48f1 ;;
            2021) FB=2021.3.45f1 ;;
            2022) FB=2022.3.62f1 ;;
            2023|[6-9][0-9][0-9][0-9]) FB=6000.0.23f1 ;;
            *) FB=2017.4.40f1 ;;   # Unity 4/5: nao existe editor Linux; o API Updater converte o projeto
          esac

          LEGACY=false      # antes da 2019.3 a Unity nao traz SDK/NDK/JDK
          OLDLIBS=false     # antes da 2020 o editor precisa de bibliotecas antigas do Linux
          NDK=r16b
          if [ "$MAJOR" -lt 2019 ] || { [ "$MAJOR" -eq 2019 ] && [ "$MINOR" -lt 3 ]; }; then LEGACY=true; fi
          if [ "$MAJOR" -lt 2020 ]; then OLDLIBS=true; fi
          if [ "$MAJOR" -eq 2019 ] && [ "$MINOR" -ge 2 ]; then NDK=r19c; fi

          echo "Unity do projeto: $V (changeset: ${REV:-desconhecido}) | plano C: $FB | legado: $LEGACY | libs antigas: $OLDLIBS"
          {
            echo "version=$V"
            echo "changeset=$REV"
            echo "version_cs=${REV:+$V ($REV)}"
            echo "fallback=$FB"
            echo "major=$MAJOR"
            echo "legacy=$LEGACY"
            echo "oldlibs=$OLDLIBS"
            echo "ndk=$NDK"
          } >> "$GITHUB_OUTPUT"

          # ----- ajustes do projeto que dependem da versao -----
          if [ "$MAJOR" -ge 2019 ] && [ -f project/ProjectSettings/ProjectSettings.asset ]; then
            # Unity 2020+/6: garante o Input antigo (o jogo usa Input.GetKey; o Input System novo nao existe aqui)
            sed -i -E 's/^(\s*activeInputHandler:).*/\1 0/' project/ProjectSettings/ProjectSettings.asset || true
          fi
          MAN=project/Packages/manifest.json
          if [ "$LEGACY" = false ] && [ -f "$MAN" ] && ! grep -q 'com.unity.modules' "$MAN"; then
            echo "manifest exportado sem os modulos da Unity; removendo para a Unity gerar o padrao"
            rm -f "$MAN" project/Packages/packages-lock.json
          fi

      - name: Bibliotecas do Linux para Unity antiga (antes da 2020)
        if: steps.unityver.outputs.oldlibs == 'true'
        timeout-minutes: 15
        run: |
          set +e
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-0 libglu1-mesa libxss1 libnss3 libasound2 libgbm1 libxi6 libxrandr2 libxcursor1 libsecret-1-0 libcurl4 >/dev/null 2>&1
          # pacotes que o Ubuntu 22.04 nao tem mais: pega no repositorio do Ubuntu 20.04 (focal)
          baixar() {  # $1 = pasta no repositorio, $2 = padrao do arquivo
            local url="http://archive.ubuntu.com/ubuntu/pool/$1/" f
            f=$(curl -fsSL "$url" | grep -oE "$2" | sort -uV | tail -n 1)
            if [ -n "$f" ] && curl -fsSL -o "/tmp/$f" "$url$f"; then echo "/tmp/$f"; fi
          }
          DEBS=""
          for item in \
            "main/o/openssl|libssl1\.1_[^\"]+_amd64\.deb" \
            "universe/g/gconf|libgconf-2-4_[^\"]+_amd64\.deb" \
            "universe/g/gconf|gconf2-common_[^\"]+_all\.deb" \
            "main/n/ncurses|libtinfo5_[^\"]+_amd64\.deb" \
            "main/n/ncurses|libncurses5_[^\"]+_amd64\.deb"; do
            D=$(baixar "${item%%|*}" "${item#*|}")
            [ -n "$D" ] && DEBS="$DEBS $D"
          done
          [ -n "$DEBS" ] && sudo apt-get install -y $DEBS >/dev/null 2>&1
          echo "Instalados:$DEBS"
          exit 0

      - name: Instalar a Unity do projeto - tentativa 1 (versao exata, com modulo Android)
        id: setup_a
        continue-on-error: true
        timeout-minutes: 60
        uses: RageAgainstThePixel/unity-setup@v1
        with:
          version-file: None
          unity-version: ${{ steps.unityver.outputs.version }}
          build-targets: Android

      - name: Instalar a Unity do projeto - tentativa 2 (versao exata + changeset)
        id: setup_b
        if: steps.setup_a.outcome == 'failure' && steps.unityver.outputs.changeset != ''
        continue-on-error: true
        timeout-minutes: 60
        uses: RageAgainstThePixel/unity-setup@v1
        with:
          version-file: None
          unity-version: ${{ steps.unityver.outputs.version_cs }}
          build-targets: Android

      - name: Instalar a Unity do projeto - tentativa 3 (LTS mais proxima)
        id: setup_c
        if: steps.setup_a.outcome == 'failure' && steps.setup_b.outcome != 'success' && steps.unityver.outputs.fallback != steps.unityver.outputs.version
        continue-on-error: true
        timeout-minutes: 60
        uses: RageAgainstThePixel/unity-setup@v1
        with:
          version-file: None
          unity-version: ${{ steps.unityver.outputs.fallback }}
          build-targets: Android

      - name: Conferir qual Unity foi instalada
        timeout-minutes: 5
        env:
          A: ${{ steps.setup_a.outcome }}
          B: ${{ steps.setup_b.outcome }}
          C: ${{ steps.setup_c.outcome }}
          ALVO: ${{ steps.unityver.outputs.version }}
          FB: ${{ steps.unityver.outputs.fallback }}
        run: |
          if [ "$A" = success ]; then echo "Unity $ALVO instalada (versao exata)."
          elif [ "$B" = success ]; then echo "Unity $ALVO instalada (usando o changeset)."
          elif [ "$C" = success ]; then echo "::warning::A Unity $ALVO nao esta disponivel para Linux. Usando a LTS mais proxima ($FB); o projeto sera convertido automaticamente."
          else
            echo "::error::Nao foi possivel instalar nenhuma Unity (exata: $ALVO | proxima: $FB). Rode de novo informando outra versao na entrada 'unity'."
            exit 1
          fi

      - name: Android SDK, NDK e JDK 8 para Unity antes da 2019.3
        if: steps.unityver.outputs.legacy == 'true'
        timeout-minutes: 30
        env:
          NDK: ${{ steps.unityver.outputs.ndk }}
        run: |
          set -e
          ROOT="$HOME/android-legacy"
          mkdir -p "$ROOT/sdk"
          JDK="${JAVA_HOME_8_X64:-$(ls -d /usr/lib/jvm/*8* 2>/dev/null | head -n 1)}"
          test -n "$JDK" || { echo "::error::JDK 8 nao encontrado no runner"; exit 1; }
          export JAVA_HOME="$JDK" PATH="$JDK/bin:$PATH"
          curl -fsSL -o /tmp/sdk-tools.zip https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip
          unzip -q /tmp/sdk-tools.zip -d "$ROOT/sdk"
          SM="$ROOT/sdk/tools/bin/sdkmanager"
          yes | "$SM" --sdk_root="$ROOT/sdk" --licenses >/dev/null || true
          "$SM" --sdk_root="$ROOT/sdk" "platform-tools" "build-tools;28.0.3" "build-tools;26.0.2" "platforms;android-28" "platforms;android-26" >/dev/null
          curl -fsSL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK}-linux-x86_64.zip"
          unzip -q /tmp/ndk.zip -d "$ROOT"
          NDKDIR=$(ls -d "$ROOT"/android-ndk-* | head -n 1)
          {
            echo "UNITY_ANDROID_SDK=$ROOT/sdk"
            echo "UNITY_ANDROID_NDK=$NDKDIR"
            echo "UNITY_ANDROID_JDK=$JDK"
            echo "ANDROID_SDK_ROOT=$ROOT/sdk"
            echo "ANDROID_HOME=$ROOT/sdk"
            echo "ANDROID_NDK_ROOT=$NDKDIR"
            echo "JAVA_HOME=$JDK"
          } >> "$GITHUB_ENV"
          echo "SDK: $ROOT/sdk | NDK: $NDKDIR | JDK: $JDK"
          df -h /

      - name: Ativar licenca Personal
        timeout-minutes: 10
        uses: RageAgainstThePixel/activate-unity-license@v1
        with:
          license: personal
          username: "opsariel123@gmail.com"
          password: "Y_6anderes"

      - name: Ligar o vigia anti-travamento do Unity
        timeout-minutes: 5
        run: |
          cat > /tmp/vigia.sh <<'WDEOF'
          #!/bin/bash
          # Roda ao lado do build. Registra em /tmp/vigia.log e:
          #  - se o APK ja foi gerado e o Unity nao fechou em 2 min, encerra o Unity;
          #  - se o log do Unity ficar parado por 30 min, mostra o diagnostico e encerra tudo.
          LOG=/tmp/vigia.log
          START=$(date +%s)
          SEEN=0
          while true; do
            sleep 60
            NOW=$(date +%s)
            if ! pgrep -f '/Editor/Unity' >/dev/null 2>&1; then
              [ "$SEEN" = 1 ] && { echo "[vigia] Unity terminou sozinho." >> $LOG; exit 0; }
              [ $((NOW-START)) -gt 7200 ] && exit 0
              continue
            fi
            SEEN=1
            NEWEST=$( { ls "$HOME/.config/unity3d/Editor.log"; find "$RUNNER_TEMP" "$GITHUB_WORKSPACE" -name '*.log' -size +1k; } 2>/dev/null | xargs -r ls -t 2>/dev/null | head -n 1)
            M=$(stat -c %Y "$NEWEST" 2>/dev/null || echo $NOW)
            IDLE=$((NOW-M))
            echo "[vigia] $(date +%H:%M:%S) Unity vivo; log parado ha $((IDLE/60)) min ($NEWEST)" >> $LOG
            tail -n 2 "$NEWEST" 2>/dev/null | cut -c1-200 | sed 's/^/[vigia]    /' >> $LOG
            APK=$(ls "$GITHUB_WORKSPACE"/build/*.apk 2>/dev/null | head -n 1)
            if [ -n "$APK" ] && [ $((NOW-$(stat -c %Y "$APK"))) -gt 120 ]; then
              echo "[vigia] APK pronto, mas o Unity nao fechou. Encerrando o Unity." >> $LOG
              pkill -9 -f '/Editor/Unity'; pkill -9 -f gradle; exit 0
            fi
            if [ "$IDLE" -gt 1800 ]; then
              echo "[vigia] Log parado ha mais de 30 min: o Unity travou. Ultimas linhas:" >> $LOG
              tail -n 40 "$NEWEST" >> $LOG 2>&1
              ps aux --sort=-%cpu | head -n 15 >> $LOG
              pkill -9 -f '/Editor/Unity'; pkill -9 -f gradle; exit 0
            fi
          done
          WDEOF
          chmod +x /tmp/vigia.sh
          : > /tmp/vigia.log
          setsid nohup /tmp/vigia.sh >/dev/null 2>&1 &
          echo "Vigia ligado."

      - name: Compilar o APK
        timeout-minutes: 110
        continue-on-error: true
        uses: RageAgainstThePixel/unity-action@v1
        with:
          log-name: build-apk
          args: -quit -batchmode -nographics -accept-apiupdate -projectPath ${{ github.workspace }}/project -buildTarget Android -executeMethod CIBuild.Build

      - name: Preparar os logs (resumo pequeno + completo compactado)
        if: always()
        timeout-minutes: 10
        run: |
          mkdir -p logs && cd logs
          if [ ! -f build-apk.log ]; then
            SRC=$( { find "$GITHUB_WORKSPACE" "$RUNNER_TEMP" -name '*.log' -size +100k; ls "$HOME/.config/unity3d/Editor.log"; } 2>/dev/null | grep -v '/logs/' | xargs -r ls -t 2>/dev/null | head -n 1)
            [ -n "$SRC" ] || { echo "Nenhum log do Unity encontrado."; exit 0; }
            echo "Log do Unity: $SRC"
            cp "$SRC" build-apk.log
          fi
          ls -lh build-apk.log
          # 1) resumo: so erros e falhas, sem repeticao (abre na hora)
          grep -aE "error CS[0-9]+|Exception|error:|Error:|FAILURE|Build Failed|BuildFailed|Aborting|Scripts have compiler errors|Build Finished|Build completed|fatal" build-apk.log \
            | cut -c1-300 | awk '!seen[$0]++' | head -n 5000 > resumo-erros.log || true
          # 2) fim do log (onde costuma estar o motivo da falha)
          tail -n 300 build-apk.log | cut -c1-300 > ultimas-linhas.log
          # 3) log completo compactado (bem menor para enviar e baixar)
          gzip -3 -c build-apk.log > build-apk.log.gz
          ls -lh resumo-erros.log ultimas-linhas.log build-apk.log.gz

      - name: Guardar os logs (comece pelo resumo-erros.log)
        if: always()
        timeout-minutes: 15
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-log
          path: |
            logs/resumo-erros.log
            logs/ultimas-linhas.log
            logs/build-apk.log.gz
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Conferir se o APK foi gerado
        timeout-minutes: 5
        run: |
          echo "--- relatorio do vigia:"; cat /tmp/vigia.log 2>/dev/null || true
          if ls build/*.apk >/dev/null 2>&1; then
            ls -lh build/*.apk
          else
            echo "::error::O APK nao foi gerado (Unity falhou ou travou). Veja o relatorio do vigia acima e o resumo de erros."
            exit 1
          fi

      - name: Enviar o APK
        timeout-minutes: 15
        uses: actions/upload-artifact@v4
        with:
          name: YanLite-Simulator-2017-APK
          path: build/*.apk
          if-no-files-found: error

      - name: Diagnostico do Unity Hub
        timeout-minutes: 5
        if: always()
        run: |
          dpkg -l | grep -i unityhub || echo "pacote unityhub NAO instalado"
          dpkg -L unityhub 2>/dev/null | head -40 || true
          ls -la /opt || true
          ls -la /opt/unityhub 2>/dev/null | head -30 || echo "sem /opt/unityhub"
          apt-cache policy unityhub | head -10 || true

      - name: Resumo dos erros do Unity
        timeout-minutes: 10
        if: failure()
        run: |
          LOGS="$HOME/.config/unity3d/Editor.log $(find "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$HOME" -name '*.log' -size +200k 2>/dev/null | head -5)"
          for f in $LOGS; do
            [ -f "$f" ] || continue
            echo "=============== $f ($(wc -l < "$f") linhas)"
            echo "--- erros de compilacao (error CS):"
            grep -E "error CS[0-9]+" "$f" | sed 's/^.*Assets\//Assets\//' | awk '!seen[$0]++' | head -40
            echo "--- total de linhas com error CS: $(grep -cE 'error CS[0-9]+' "$f")"
            echo "--- outras falhas:"
            grep -nE "Scripts have compiler errors|Build Failed|BuildFailedException|Aborting batchmode|Android SDK|NDK|Gradle|FAILURE|Exception:" "$f" | awk '!seen[$0]++' | head -30
          done
